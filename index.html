<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>工作待办</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
/* ============================================================
   DESIGN SYSTEM — 暖奶油 · 高密度
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fdf9f1;
  --card-bg: #ffffff;
  --sidebar-bg: #f5edde;
  --surface-2: #faf3e6;
  --text: #2d2417;
  --text-secondary: #6b5a3f;
  --text-muted: #b8a280;
  --border: #ede4cf;
  --border-light: #f3ead6;
  --accent: #b8965a;
  --accent-hover: #a37a3d;
  --accent-subtle: #f4e4c3;
  --green: #6b9e85;
  --green-bg: #eef5f0;
  --red: #c4554d;
  --priority-p1: #b8965a;
  --priority-p2: #c8a679;
  --priority-p3: #d9c9a8;
  --focus-bg: rgba(45,36,23,0.94);

  --shadow-sm: 0 1px 2px rgba(150,110,50,0.06);
  --shadow-md: 0 2px 8px rgba(150,110,50,0.12);
  --shadow-lg: 0 8px 24px rgba(150,110,50,0.18);

  --sidebar-w: 240px;
  --detail-w: 440px;
  --radius-xs: 4px;
  --radius-sm: 7px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --transition: 0.2s cubic-bezier(0.22, 0.11, 0.12, 1);
  --transition-slow: 0.35s cubic-bezier(0.22, 0.11, 0.12, 1);

  --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', '微软雅黑', 'Helvetica Neue', sans-serif;
}

html { scrollbar-gutter: stable; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border); }

body {
  font-family: var(--font-stack);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 14px;
  letter-spacing: -0.01em;
  cursor: pointer;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.app-layout { display: flex; height: 100vh; }

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  user-select: none;
  overflow: hidden;
}
.sidebar-brand {
  padding: 28px 24px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.brand-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
.brand-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.brand-date {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 1px;
}

.sidebar-scroll { flex: 1; overflow-y: auto; padding: 0 12px; }

.nav-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 550;
  color: var(--text-secondary);
  transition: all var(--transition);
}
.nav-item:hover { background: var(--accent-subtle); color: var(--text); }
.nav-item.active { background: var(--accent); color: #fff; }
.nav-item .nav-icon { font-size: 15px; width: 22px; text-align: center; opacity: 0.7; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-badge {
  margin-left: auto;
  background: rgba(0,0,0,0.06);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  min-width: 22px;
  text-align: center;
}
.nav-item.active .nav-badge { background: rgba(255,255,255,0.2); color: #fff; }

/* Tag filter in sidebar */
.sidebar-tags {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.sidebar-tags-header {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0 14px;
  margin-bottom: 8px;
}
.sidebar-tag-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--transition);
}
.sidebar-tag-item:hover { background: var(--accent-subtle); color: var(--text); }
.sidebar-tag-item.active { background: var(--accent); color: #fff; }
.sidebar-tag-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}
.sidebar-tag-item.active .sidebar-tag-count { color: rgba(255,255,255,0.7); }

.sidebar-footer {
  padding: 16px 24px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  border-top: 1px solid var(--border);
  margin: 0 12px;
  flex-shrink: 0;
}
.progress-ring-wrap {
  position: relative;
  width: 52px; height: 52px;
}
.progress-ring-wrap svg { transform: rotate(-90deg); }
.progress-ring-label {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
  text-align: center;
  letter-spacing: 0.02em;
}

/* Export buttons */
.export-section {
  display: flex;
  gap: 4px;
}
.export-btn {
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  background: transparent;
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  font-family: inherit;
  transition: all var(--transition);
}
.export-btn:hover { border-color: var(--accent); color: var(--text); }

/* ============================================================
   MAIN AREA
   ============================================================ */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  background: var(--bg);
}
.view-panel { display: flex; flex-direction: column; height: 100%; }

.view-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 32px 20px;
  flex-shrink: 0;
}
.view-header h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
.view-actions { display: flex; gap: 8px; align-items: center; }

.toolbar-row {
  padding: 4px 28px 16px;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  flex-wrap: wrap;
  align-items: center;
}

.view-content {
  flex: 1;
  overflow-y: auto;
  padding: 0 32px 32px;
}

/* Active tag indicator */
.active-tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  background: var(--accent);
  color: #fff;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.active-tag-chip:hover { background: var(--accent-hover); }
.active-tag-chip .tag-chip-x { font-size: 13px; line-height: 1; opacity: 0.8; }

/* ============================================================
   BUTTONS & INPUTS
   ============================================================ */
.btn {
  padding: 9px 20px;
  border: none;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  letter-spacing: -0.01em;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-0.5px); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.btn-primary:active { transform: translateY(0); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--accent-subtle); color: var(--text); }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-xs { padding: 3px 10px; font-size: 11px; border-radius: 12px; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #b04a44; }

input, select, textarea {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  outline: none;
  background: var(--card-bg);
  color: var(--text);
  font-family: inherit;
  transition: all var(--transition);
  letter-spacing: -0.01em;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
}
textarea { resize: vertical; min-height: 60px; }

.filter-group {
  display: flex;
  gap: 2px;
  background: var(--border-light);
  border-radius: var(--radius-sm);
  padding: 3px;
}
.filter-btn {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  color: var(--text-secondary);
  transition: all var(--transition);
  white-space: nowrap;
  font-family: inherit;
}
.filter-btn.active { background: var(--card-bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.filter-btn:hover:not(.active) { color: var(--text); }

.search-input {
  width: 180px;
  padding: 9px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  background: var(--card-bg);
}
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }
.search-input::placeholder { color: var(--text-muted); }

/* ============================================================
   TASK CARDS — Dense Grid
   ============================================================ */
.task-tree { display: flex; flex-direction: column; gap: 1px; }
.task-row {
  display: grid;
  grid-template-columns: 28px 18px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 5px 14px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--transition), box-shadow var(--transition);
  position: relative;
  min-height: 34px;
}
.task-row:hover {
  background: var(--surface-2);
  box-shadow: var(--shadow-sm);
}
.task-row.completed { background: #faf7f1; }
.task-row.completed .task-row-title { color: var(--text-muted); text-decoration: line-through; }
.task-row.status-in-progress { border-left: 3px solid var(--accent); }
.task-row.priority-p1 { border-left: 3px solid var(--accent); }
.task-row.priority-p2 { border-left: 3px solid var(--accent-hover); }
.task-row.priority-p3 { border-left: 3px solid var(--border); }

.expand-btn {
  width: 22px; height: 22px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 10px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-xs);
  flex-shrink: 0;
  transition: transform var(--transition);
  order: -1;
}
.expand-btn:hover { color: var(--text); background: var(--accent-subtle); }
.expand-btn.expanded { transform: rotate(90deg); }
.expand-btn.placeholder { visibility: hidden; }

.status-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  justify-self: center;
}
.status-dot.completed { background: var(--green); }
.status-dot.in-progress { background: var(--accent); }
.status-dot.not-started { background: transparent; border: 2px solid var(--border); }

.task-row-body { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; overflow: hidden; }
.task-row-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
}
.task-row-meta { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

.status-badge { display: none; } /* hide old text badge, use dot instead */

.priority-badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
}
.priority-badge.p1 { background: var(--accent-subtle); color: var(--accent-hover); }
.priority-badge.p2 { background: #ede4cf; color: #6b5a3f; }
.priority-badge.p3 { background: #f3ead6; color: #a8916a; }

.tag-chips { display: flex; gap: 3px; flex-shrink: 0; }
.tag-chip {
  display: inline-flex;
  padding: 1px 7px;
  background: var(--accent-subtle);
  color: #6b5a3f;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 500;
}

.progress-tag { font-size: 11px; color: var(--text-muted); font-weight: 500; }

.date-range { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

.task-row.key-focused {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  background: var(--accent-subtle);
}

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.task-row.card-enter { animation: cardEnter 0.25s ease; }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state {
  text-align: center;
  padding: 100px 20px;
  color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 36px; margin-bottom: 16px; opacity: 0.4; }
.empty-state p { font-size: 14px; font-weight: 500; }

/* ============================================================
   DAILY WORK
   ============================================================ */
.daily-section { margin-bottom: 32px; }
.daily-section h3 {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 14px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.daily-list { display: flex; flex-direction: column; gap: 8px; }
.daily-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 9px 16px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  min-height: 34px;
}
.daily-item:hover {
  background: var(--surface-2);
  box-shadow: var(--shadow-sm);
}
.daily-item-body { flex: 1; min-width: 0; }
.daily-item-title { font-size: 15px; font-weight: 550; }
.daily-item-parent { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* Daily Note */
.daily-note-card {
  background: var(--surface-2);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 24px;
  transition: border-color var(--transition);
}
.daily-note-card:focus-within { border-color: var(--accent); }
.daily-note-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.daily-note-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.daily-note-saved {
  font-size: 11px;
  color: var(--green);
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.daily-note-saved.visible { opacity: 1; }
.daily-note-input {
  width: 100%;
  border: none;
  background: transparent;
  font-size: 13.5px;
  font-family: inherit;
  color: var(--text);
  resize: vertical;
  min-height: 60px;
  padding: 0;
  outline: none;
  line-height: 1.6;
  letter-spacing: -0.01em;
}
.daily-note-input::placeholder { color: var(--text-muted); }

/* ============================================================
   CALENDAR
   ============================================================ */
.calendar-nav {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}
.calendar-nav h3 { font-size: 20px; font-weight: 600; min-width: 140px; text-align: center; }
.calendar-nav .btn { padding: 8px 12px; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px;
}
.calendar-day-header {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  padding: 10px 0 6px;
  letter-spacing: 0.03em;
}
.calendar-day {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  padding: 6px 4px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 56px;
}
.calendar-day:hover { background: var(--accent-subtle); }
.calendar-day.other-month { opacity: 0.2; }
.calendar-day.today { background: var(--accent); }
.calendar-day .day-num { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.calendar-day.today .day-num { color: #fff; font-weight: 700; }
.calendar-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.calendar-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.calendar-dot.completed { background: var(--green); }
.calendar-dot.in-progress { background: var(--accent); }
.calendar-dot.not-started { background: var(--border); }
.calendar-day.today .calendar-dot.completed,
.calendar-day.today .calendar-dot.in-progress { background: rgba(255,255,255,0.9); }
.calendar-day.today .calendar-dot.not-started { background: rgba(255,255,255,0.45); }

.calendar-popover {
  display: none;
  position: fixed;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: 0 12px 40px rgba(0,0,0,0.1);
  padding: 16px;
  z-index: 100;
  min-width: 220px;
  max-width: 320px;
}
.calendar-popover.show { display: block; animation: fadeIn 0.15s ease; }
.calendar-popover h4 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.calendar-popover .popover-task {
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background var(--transition);
}
.calendar-popover .popover-task:hover { background: var(--accent-subtle); }

/* ============================================================
   GANTT
   ============================================================ */
.gantt-container { overflow-x: auto; overflow-y: auto; flex: 1; }
.gantt-chart { position: relative; min-width: 100%; }
.gantt-header {
  display: flex;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 2;
  border-bottom: 1px solid var(--border);
}
.gantt-label-col {
  width: 220px; flex-shrink: 0;
  padding: 8px 14px;
  font-size: 10px; font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.gantt-timeline-col { flex: 1; display: flex; }
.gantt-day-cell {
  flex: 1; min-width: 28px;
  text-align: center;
  font-size: 10px;
  padding: 8px 0;
  color: var(--text-muted);
  border-left: 0.5px solid var(--border-light);
}
.gantt-month-row { display: flex; border-bottom: 1px solid var(--border); }
.gantt-month-cell {
  text-align: center;
  font-size: 11px;
  padding: 5px 0;
  color: var(--text-secondary);
  font-weight: 600;
}
.gantt-row { display: flex; border-bottom: 0.5px solid var(--border-light); }
.gantt-row:hover { background: var(--accent-subtle); }
.gantt-row-label {
  width: 220px; flex-shrink: 0;
  padding: 8px 14px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  cursor: pointer;
  border-right: 0.5px solid var(--border-light);
}
.gantt-row-bars { flex: 1; position: relative; display: flex; }
.gantt-bar-cell { flex: 1; min-width: 28px; min-height: 34px; position: relative; }
.gantt-bar {
  position: absolute;
  top: 8px; bottom: 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: all var(--transition);
  min-width: 4px;
}
.gantt-bar:hover { opacity: 0.85; }
.gantt-bar.completed { background: var(--green); }
.gantt-bar.in-progress { background: var(--accent); }
.gantt-bar.not-started { background: var(--border); }
.gantt-section-title {
  padding: 10px 14px;
  font-size: 10px; font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border);
}

/* ============================================================
   DETAIL PANEL
   ============================================================ */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.15);
  z-index: 50;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.overlay.show { display: block; animation: fadeIn 0.25s ease; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.detail-panel {
  position: fixed;
  top: 0; right: 0;
  width: var(--detail-w);
  max-width: 100vw;
  height: 100vh;
  background: var(--card-bg);
  box-shadow: -4px 0 40px rgba(0,0,0,0.08);
  z-index: 60;
  transform: translateX(100%);
  transition: transform var(--transition-slow);
  display: flex;
  flex-direction: column;
}
.detail-panel.open { transform: translateX(0); }

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.detail-header h3 { font-size: 17px; font-weight: 650; }
.detail-close {
  width: 30px; height: 30px;
  border: none;
  background: var(--accent-subtle);
  cursor: pointer;
  font-size: 16px;
  border-radius: 50%;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.detail-close:hover { background: rgba(0,0,0,0.1); color: var(--text); }

.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.detail-field { display: flex; flex-direction: column; gap: 6px; }
.detail-field label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.detail-field input, .detail-field textarea, .detail-field select { width: 100%; }

.status-select {
  display: inline-flex;
  gap: 2px;
  background: var(--border-light);
  border-radius: var(--radius-sm);
  padding: 3px;
}
.status-select button {
  padding: 7px 18px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  color: var(--text-secondary);
  transition: all var(--transition);
  font-family: inherit;
}
.status-select button.active { background: var(--card-bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.status-select button:hover:not(.active) { color: var(--text); }

/* Priority selector in detail */
.priority-select {
  display: inline-flex;
  gap: 2px;
  background: var(--border-light);
  border-radius: var(--radius-sm);
  padding: 3px;
}
.priority-select button {
  padding: 7px 14px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  color: var(--text-secondary);
  transition: all var(--transition);
  font-family: inherit;
}
.priority-select button.active { background: var(--card-bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.priority-select button:hover:not(.active) { color: var(--text); }
.priority-select button.p1.active { color: var(--priority-p1); }
.priority-select button.p2.active { color: var(--priority-p2); }
.priority-select button.p3.active { color: var(--priority-p3); }

/* Tag input in detail */
.tag-edit-wrap {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.tag-edit-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 10px;
  background: var(--accent-subtle);
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.tag-edit-chip .tag-remove {
  cursor: pointer;
  font-size: 13px;
  opacity: 0.4;
  transition: opacity var(--transition);
}
.tag-edit-chip .tag-remove:hover { opacity: 0.8; }

.detail-subtasks { margin-top: 4px; }
.detail-subtasks h4 {
  font-size: 13px;
  font-weight: 650;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.subtask-list { display: flex; flex-direction: column; gap: 2px; }
.subtask-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.subtask-item:hover { background: var(--accent-subtle); }
.subtask-item.completed .subtask-title {
  text-decoration: line-through;
  color: var(--text-muted);
  text-decoration-color: var(--text-muted);
}
.subtask-title { font-size: 13px; }
.add-subtask-form { display: flex; gap: 8px; margin-top: 10px; }
.add-subtask-form input { flex: 1; font-size: 13px; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  background: var(--accent-subtle);
  color: var(--text-secondary);
}

/* Focus button in detail */
.btn-focus {
  background: var(--accent);
  color: #fff;
  padding: 10px 24px;
  border: none;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all var(--transition);
}
.btn-focus:hover { background: var(--accent-hover); transform: translateY(-0.5px); }

/* ============================================================
   QUICK ADD (FAB + MODAL)
   ============================================================ */
.fab {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  transition: all var(--transition);
  z-index: 40;
  font-family: inherit;
  line-height: 1;
}
.fab:hover { background: var(--accent-hover); transform: scale(1.06); box-shadow: 0 6px 28px rgba(0,0,0,0.2); }
.fab:active { transform: scale(0.96); }

.quick-add-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 70;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
}
.quick-add-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
.quick-add-modal {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 480px;
  max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}
.quick-add-modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.quick-add-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 16px;
  line-height: 1.5;
}
.quick-add-hint code {
  background: var(--accent-subtle);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
}
.quick-add-input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 16px;
  font-family: inherit;
  outline: none;
  transition: all var(--transition);
}
.quick-add-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }
.quick-add-preview {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
  min-height: 24px;
  align-items: center;
}
.quick-add-preview .preview-item {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 10px;
  background: var(--accent-subtle);
  color: var(--text-secondary);
}
.quick-add-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

/* ============================================================
   FOCUS MODE
   ============================================================ */
.focus-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--focus-bg);
  z-index: 80;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.focus-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
.focus-card {
  text-align: center;
  color: #fff;
}
.focus-task-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 32px;
  max-width: 400px;
  opacity: 0.9;
  letter-spacing: -0.02em;
}
.focus-ring-wrap {
  position: relative;
  width: 220px; height: 220px;
  margin: 0 auto;
}
.focus-ring-wrap svg { transform: rotate(-90deg); }
.focus-time {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  font-weight: 200;
  letter-spacing: -0.03em;
  color: #fff;
}
.focus-presets {
  display: flex;
  gap: 8px;
  margin-top: 28px;
  justify-content: center;
}
.focus-preset-btn {
  padding: 7px 18px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  background: transparent;
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all var(--transition);
}
.focus-preset-btn:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
.focus-preset-btn.active { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); color: #fff; }
.focus-controls {
  display: flex;
  gap: 16px;
  margin-top: 24px;
  justify-content: center;
  align-items: center;
}
.focus-ctrl-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25);
  background: transparent;
  color: rgba(255,255,255,0.8);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.focus-ctrl-btn:hover { border-color: rgba(255,255,255,0.5); color: #fff; background: rgba(255,255,255,0.08); }
.focus-ctrl-btn.play-btn { width: 64px; height: 64px; font-size: 24px; }
.focus-exit {
  margin-top: 32px;
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  cursor: pointer;
  border: none;
  background: transparent;
  font-family: inherit;
  transition: color var(--transition);
}
.focus-exit:hover { color: rgba(255,255,255,0.7); }

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
.cmdk-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(45,36,23,0.25);
  z-index: 90;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  align-items: flex-start;
  justify-content: center;
  padding-top: 18vh;
}
.cmdk-overlay.show { display: flex; animation: fadeIn 0.15s ease; }
.cmdk-modal {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 560px;
  max-width: 90vw;
  max-height: 60vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cmdk-input {
  width: 100%;
  padding: 16px 20px;
  border: none;
  border-bottom: 1px solid var(--border-light);
  font-size: 16px;
  font-family: var(--font-stack);
  outline: none;
  background: transparent;
  color: var(--text);
}
.cmdk-input::placeholder { color: var(--text-muted); }
.cmdk-list { flex: 1; overflow-y: auto; padding: 8px; }
.cmdk-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: background var(--transition);
}
.cmdk-item.active { background: var(--accent-subtle); }
.cmdk-item .cmdk-icon { font-size: 16px; width: 24px; text-align: center; opacity: 0.7; flex-shrink: 0; }
.cmdk-item .cmdk-label { flex: 1; }
.cmdk-item .cmdk-hint { font-size: 11px; color: var(--text-muted); }
.cmdk-group-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 12px 14px 4px;
}
.cmdk-footer {
  padding: 8px 16px;
  font-size: 11px;
  color: var(--text-muted);
  border-top: 1px solid var(--border-light);
  text-align: center;
  display: flex; gap: 12px; justify-content: center;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
  transform: translateX(-50%) translateY(10px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 768px) {
  .sidebar { width: 56px; }
  .sidebar-brand { padding: 16px 8px; justify-content: center; }
  .brand-title, .brand-date { display: none; }
  .sidebar-tags { display: none; }
  .nav-item { justify-content: center; padding: 10px; }
  .nav-item span:not(.nav-icon) { display: none; }
  .nav-badge { display: none; }
  .sidebar-footer { padding: 12px 8px; margin: 0 4px; }
  .progress-ring-wrap { width: 32px; height: 32px; }
  .progress-ring-wrap svg { width: 32px; height: 32px; }
  .progress-ring-label { display: none; }
  .export-section { display: none; }
  .detail-panel { width: 100%; }
  .view-header { padding: 20px 16px; flex-wrap: wrap; gap: 8px; }
  .view-header h2 { font-size: 20px; }
  .toolbar-row { padding: 4px 12px 12px; }
  .search-input { width: 120px; }
  .view-content { padding: 0 12px 12px; }
  .task-row { padding: 12px 14px; }
  .fab { bottom: 20px; right: 20px; width: 44px; height: 44px; font-size: 20px; }
  .quick-add-modal { width: 95vw; padding: 20px; }
  .cmdk-modal { width: 95vw; }
  .task-row { padding: 5px 10px; grid-template-columns: 22px 15px 1fr auto; gap: 6px; }
  .focus-ring-wrap { width: 180px; height: 180px; }
  .focus-time { font-size: 42px; }
}
</style>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-dot"></div>
      <div>
        <div class="brand-title">工作待办</div>
        <div class="brand-date" id="sidebarDate"></div>
      </div>
    </div>
    <div class="sidebar-scroll">
      <ul class="nav-list">
        <li class="nav-item active" data-view="list">
          <span class="nav-icon">☰</span> 总任务列表
          <span class="nav-badge" id="navCountTotal">0</span>
        </li>
        <li class="nav-item" data-view="daily">
          <span class="nav-icon">☀</span> 每日工作
          <span class="nav-badge" id="navCountDaily">0</span>
        </li>
        <li class="nav-item" data-view="calendar">
          <span class="nav-icon">◷</span> 日历表
        </li>
        <li class="nav-item" data-view="gantt">
          <span class="nav-icon">▦</span> 甘特图
        </li>
      </ul>
      <div class="sidebar-tags" id="sidebarTags">
        <div class="sidebar-tags-header">标签</div>
        <div id="sidebarTagList"></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="progress-ring-wrap">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="var(--border)" stroke-width="3"/>
          <circle cx="26" cy="26" r="22" fill="none" stroke="var(--accent)" stroke-width="3"
                  stroke-dasharray="138.23" stroke-dashoffset="138.23"
                  stroke-linecap="round" id="progressRing"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:11px;font-weight:700;color:var(--text);" id="progressText">--</span>
        </div>
      </div>
      <div class="progress-ring-label">今日完成</div>
      <div class="export-section">
        <button class="export-btn" onclick="exportData('json')">JSON</button>
        <button class="export-btn" onclick="exportData('md')">Markdown</button>
        <button class="export-btn" onclick="generatePPT()" style="background:var(--accent);color:#fff;border-color:var(--accent);">PPT报告</button>
      </div>
    </div>
  </nav>

  <!-- Main Area -->
  <main class="main-area" id="mainArea">
    <!-- View: Task List -->
    <div class="view-panel" id="view-list" style="display:flex;">
      <div class="view-header">
        <h2>总任务列表</h2>
        <div class="view-actions">
          <button class="btn btn-primary btn-sm" id="btnAddRoot">+ 新建任务</button>
        </div>
      </div>
      <div class="toolbar-row">
        <input type="text" class="search-input" id="listSearch" placeholder="搜索...">
        <div class="filter-group" id="listStatusFilter">
          <button class="filter-btn active" data-status="all">全部</button>
          <button class="filter-btn" data-status="in-progress">进行中</button>
          <button class="filter-btn" data-status="not-started">未开始</button>
          <button class="filter-btn" data-status="completed">已完成</button>
        </div>
        <div class="filter-group" id="listPriorityFilter">
          <button class="filter-btn active" data-priority="all">全部</button>
          <button class="filter-btn" data-priority="1">P1</button>
          <button class="filter-btn" data-priority="2">P2</button>
          <button class="filter-btn" data-priority="3">P3</button>
        </div>
        <span id="activeTagChip"></span>
      </div>
      <div class="view-content" id="listContent"></div>
    </div>

    <!-- View: Daily Work -->
    <div class="view-panel" id="view-daily" style="display:none;">
      <div class="view-header">
        <h2>每日工作</h2>
        <span style="font-size:13px; color:var(--text-muted);" id="dailyDate"></span>
      </div>
      <div class="view-content" id="dailyContent">
        <div class="daily-note-card">
          <div class="daily-note-header">
            <span class="daily-note-label">便签</span>
            <span class="daily-note-saved" id="dailyNoteSaved">已保存</span>
          </div>
          <textarea class="daily-note-input" id="dailyNoteInput" placeholder="记录今天的小任务或备忘..."></textarea>
        </div>
        <div id="dailyTasksContainer"></div>
      </div>
    </div>

    <!-- View: Calendar -->
    <div class="view-panel" id="view-calendar" style="display:none;">
      <div class="view-header"><h2>日历表</h2></div>
      <div class="view-content" id="calendarContent"></div>
    </div>

    <!-- View: Gantt -->
    <div class="view-panel" id="view-gantt" style="display:none;">
      <div class="view-header"><h2>甘特图</h2></div>
      <div class="gantt-container view-content" id="ganttContent" style="padding:8px;"></div>
    </div>
  </main>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Detail Panel -->
<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <h3>任务详情</h3>
    <button class="detail-close" id="btnDetailClose">✕</button>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- Calendar Popover -->
<div class="calendar-popover" id="calendarPopover"></div>

<!-- FAB -->
<button class="fab" id="fabBtn" title="快速添加 (Cmd+K)">+</button>

<!-- Quick Add Modal -->
<div class="quick-add-overlay" id="quickAddOverlay">
  <div class="quick-add-modal">
    <h3>快速添加任务</h3>
    <div class="quick-add-hint">
      <code>!!</code> P1 <code>!</code> P2 <code>#标签</code> 日期关键词如 <code>明天</code> <code>周五</code>
    </div>
    <input type="text" class="quick-add-input" id="quickAddInput" placeholder="输入任务..." autocomplete="off">
    <div class="quick-add-preview" id="quickAddPreview"></div>
    <div class="quick-add-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeQuickAdd()">取消</button>
      <button class="btn btn-primary btn-sm" onclick="submitQuickAdd()">创建</button>
    </div>
  </div>
</div>

<!-- Focus Overlay -->
<div class="focus-overlay" id="focusOverlay">
  <div class="focus-card">
    <div class="focus-task-title" id="focusTaskTitle"></div>
    <div class="focus-ring-wrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
        <circle cx="110" cy="110" r="100" fill="none" stroke="#fff" stroke-width="4"
                stroke-dasharray="628.32" stroke-dashoffset="0"
                stroke-linecap="round" id="focusRing"/>
      </svg>
      <div class="focus-time" id="focusTime">25:00</div>
    </div>
    <div class="focus-presets">
      <button class="focus-preset-btn active" data-min="25">25分</button>
      <button class="focus-preset-btn" data-min="15">15分</button>
      <button class="focus-preset-btn" data-min="5">5分</button>
    </div>
    <div class="focus-controls">
      <button class="focus-ctrl-btn" onclick="resetFocus()" title="重置">↺</button>
      <button class="focus-ctrl-btn play-btn" id="focusPlayBtn" onclick="toggleFocus()" title="开始">▶</button>

<script>
// ============================================================
// DATA LAYER
// ============================================================
const STORAGE_KEY = 'todo_v2';
const SUPABASE_URL = 'https://xpaholrklbmdmpnmdrso.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DsEhyR5-TZl4J5bG65BnxA_u04H28Nt';

let supabaseClient = null;
try {
  if (typeof supabase !== 'undefined') {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch(e) { console.warn('Supabase init failed:', e); }

function toDB(task) {
  return {
    id: task.id,
    title: task.title,
    description: task.description || '',
    status: task.status,
    start_date: task.startDate,
    due_date: task.dueDate,
    parent_id: task.parentId,
    sort_order: task.order,
    created_at: task.createdAt,
    tags: (task.tags || []).join(','),
    priority: task.priority || null
  };
}

function fromDB(row) {
  return {
    id: row.id,
    title: row.title,
    description: row.description || '',
    status: row.status,
    startDate: row.start_date,
    dueDate: row.due_date,
    parentId: row.parent_id,
    order: row.sort_order,
    createdAt: row.created_at,
    tags: row.tags ? row.tags.split(',').filter(Boolean) : [],
    priority: row.priority || null
  };
}

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveLocal() {
  // Backup before overwriting
  const prev = localStorage.getItem(STORAGE_KEY);
  if (prev && prev !== '[]') {
    localStorage.setItem(STORAGE_KEY + '_backup', prev);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

async function loadTodos() {
  // Always load local first as fallback
  const localData = loadLocal();

  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient.from('todos').select('*');
      if (!error && data && data.length > 0) {
        const mapped = data.map(fromDB);
        // Merge: Supabase wins for existing ids, local keeps orphaned
        const supabaseIds = new Set(mapped.map(t => t.id));
        const merged = [...mapped, ...localData.filter(t => !supabaseIds.has(t.id))];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        return merged;
      }
      // Supabase empty — sync local data up to Supabase
      if (localData.length > 0) {
        todos = localData;
        await saveTodos();
      }
    } catch(e) { console.warn('Supabase load failed, using local:', e); }
  }
  return localData;
}

async function saveTodos() {
  saveLocal();
  if (supabaseClient) {
    try {
      const rows = todos.map(toDB);
      await supabaseClient.from('todos').delete().neq('id', -1);
      if (rows.length > 0) {
        const chunkSize = 50;
        for (let i = 0; i < rows.length; i += chunkSize) {
          await supabaseClient.from('todos').insert(rows.slice(i, i + chunkSize));
        }
      }
    } catch(e) { console.warn('Supabase save failed:', e); }
  }
}

let todos = [];
let nextId = 1;

function migrateTask(task) {
  if (!('tags' in task)) task.tags = [];
  if (!('priority' in task)) task.priority = null;
  if (!('archivedAt' in task)) task.archivedAt = null;
  return task;
}

async function initData() {
  todos = (await loadTodos()).map(migrateTask);

  // Legacy migration
  if (todos.length > 0 && 'category' in todos[0]) {
    todos = todos.map(t => ({
      id: t.id || Date.now(),
      title: t.title || '',
      description: '',
      status: t.completed ? 'completed' : 'not-started',
      startDate: null,
      dueDate: t.dueDate || null,
      parentId: null,
      order: t.createdAt || Date.now(),
      createdAt: t.createdAt || Date.now(),
      tags: [],
      priority: null,
      archivedAt: null
    }));
    await saveTodos();
  }

  const needsSave = todos.some(t => !('tags' in t));
  if (needsSave) await saveTodos();

  nextId = todos.length > 0 ? Math.max(...todos.map(t => t.id)) + 1 : 1;
}

function getTask(id) { return todos.find(t => t.id === id); }
function getChildren(parentId) { return todos.filter(t => t.parentId === parentId).sort((a,b) => a.order - b.order); }
function getRootTasks() { return todos.filter(t => !t.parentId).sort((a,b) => a.order - b.order); }
function hasChildren(id) { return todos.some(t => t.parentId === id); }

function getDescendants(parentId) {
  const result = [];
  const children = getChildren(parentId);
  for (const c of children) { result.push(c); result.push(...getDescendants(c.id)); }
  return result;
}

function getAncestors(id) {
  const result = [];
  let current = getTask(id);
  while (current && current.parentId) {
    current = getTask(current.parentId);
    if (current) result.unshift(current);
  }
  return result;
}

function countSubtasks(id) {
  const children = getChildren(id);
  let total = children.length;
  for (const c of children) total += countSubtasks(c.id);
  return total;
}

function countCompletedSubtasks(id) {
  const children = getChildren(id);
  let done = children.filter(c => c.status === 'completed').length;
  for (const c of children) done += countCompletedSubtasks(c.id);
  return done;
}

// ============================================================
// TAGS HELPERS
// ============================================================
function getAllTags() {
  const map = {};
  for (const t of todos) {
    if (!t.tags) continue;
    for (const tag of t.tags) {
      if (!map[tag]) map[tag] = 0;
      map[tag]++;
    }
  }
  return Object.entries(map).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
}

function updateTaskTags(id, tagString) {
  const tags = tagString.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  updateTask(id, { tags });
}

// ============================================================
// AUTO STATUS
// ============================================================
async function recalcParentStatus(parentId) {
  const parent = getTask(parentId);
  if (!parent) return;
  const children = getChildren(parentId);
  if (children.length === 0) return;
  const allDone = children.every(c => c.status === 'completed');
  const anyInProgress = children.some(c => c.status === 'in-progress');
  const allNotStarted = children.every(c => c.status === 'not-started');
  let newStatus = parent.status;
  if (allDone) newStatus = 'completed';
  else if (anyInProgress) newStatus = 'in-progress';
  else if (allNotStarted) newStatus = 'not-started';
  if (newStatus !== parent.status) {
    parent.status = newStatus;
    await saveTodos();
    if (parent.parentId) await recalcParentStatus(parent.parentId);
  }
}

async function recalcAllParentStatuses() {
  const allParentIds = new Set(todos.filter(t => t.parentId).map(t => t.parentId));
  const sorted = [...allParentIds].sort((a, b) => {
    const depthA = getAncestors(a).length;
    const depthB = getAncestors(b).length;
    return depthB - depthA;
  });
  for (const id of sorted) await recalcParentStatus(id);
}

// ============================================================
// CRUD
// ============================================================
async function addTask(title, parentId = null, extra = {}) {
  const task = {
    id: nextId++,
    title: title.trim(),
    description: '',
    status: 'not-started',
    startDate: null,
    dueDate: null,
    parentId,
    order: Date.now(),
    createdAt: Date.now(),
    tags: [],
    priority: null,
    archivedAt: null,
    ...extra
  };
  todos.push(task);
  await saveTodos();
  if (parentId) {
    const parent = getTask(parentId);
    if (parent && parent.status === 'not-started') {
      parent.status = 'in-progress';
      await saveTodos();
      await recalcParentStatus(parent.parentId);
    }
  }
  window._newTaskId = task.id;
  renderAll();
  return task;
}

async function updateTask(id, changes) {
  const task = getTask(id);
  if (!task) return;
  const oldStatus = task.status;
  Object.assign(task, changes);
  // Auto-archive when completed
  if (changes.status === 'completed' && !task.archivedAt) {
    task.archivedAt = Date.now();
  }
  if (changes.status && changes.status !== 'completed' && task.archivedAt) {
    task.archivedAt = null;
  }
  await saveTodos();
  if (changes.status && changes.status !== oldStatus) {
    if (task.parentId) await recalcParentStatus(task.parentId);
  }
  renderAll();
}

async function deleteTask(id) {
  const descendants = getDescendants(id);
  const idsToDelete = new Set([id, ...descendants.map(d => d.id)]);
  const parentId = getTask(id)?.parentId;
  todos = todos.filter(t => !idsToDelete.has(t.id));
  await saveTodos();
  if (parentId) {
    const remaining = getChildren(parentId);
    if (remaining.length === 0) {
      const parent = getTask(parentId);
      if (parent && parent.status === 'in-progress') {
        parent.status = 'not-started';
        await saveTodos();
      }
    }
    await recalcParentStatus(parentId);
  }
  renderAll();
}

// ============================================================
// NLP PARSER for Quick Add
// ============================================================
function parseQuickAdd(input) {
  let text = input.trim();
  let priority = null;
  let tags = [];
  let dueDate = null;

  // Extract priority: !! P1, ! P2
  if (text.startsWith('!!')) { priority = 1; text = text.slice(2).trim(); }
  else if (text.startsWith('!')) { priority = 2; text = text.slice(1).trim(); }

  // Extract tags: #tagname
  text = text.replace(/#(\S+)/g, (match, tag) => { tags.push(tag); return ''; });

  // Date patterns at the end
  const todayDate = new Date(today.getTime());
  const datePatterns = [
    { re: /今天$/, fn: () => toDateStr(todayDate) },
    { re: /明天$/, fn: () => { const d=new Date(todayDate); d.setDate(d.getDate()+1); return toDateStr(d); } },
    { re: /后天$/, fn: () => { const d=new Date(todayDate); d.setDate(d.getDate()+2); return toDateStr(d); } },
    { re: /大后天$/, fn: () => { const d=new Date(todayDate); d.setDate(d.getDate()+3); return toDateStr(d); } },
    { re: /周(一|二|三|四|五|六|日)$/, fn: (m) => {
      const targetDay = ['日','一','二','三','四','五','六'].indexOf(m[1]);
      const d = new Date(todayDate);
      const currentDay = d.getDay();
      let diff = targetDay - currentDay;
      if (diff <= 0) diff += 7;
      d.setDate(d.getDate() + diff);
      return toDateStr(d);
    }},
    { re: /下周(一|二|三|四|五|六|日)$/, fn: (m) => {
      const targetDay = ['日','一','二','三','四','五','六'].indexOf(m[1]);
      const d = new Date(todayDate);
      const currentDay = d.getDay();
      let diff = targetDay - currentDay;
      if (diff <= 0) diff += 7;
      d.setDate(d.getDate() + diff + 7);
      return toDateStr(d);
    }},
    { re: /(\d+)月(\d+)[日号]$/, fn: (m) => {
      const y = todayDate.getFullYear();
      const mo = parseInt(m[1]);
      const da = parseInt(m[2]);
      const d = new Date(y, mo-1, da);
      if (d < todayDate) d.setFullYear(y+1);
      return toDateStr(d);
    }}
  ];

  for (const {re, fn} of datePatterns) {
    const match = text.match(re);
    if (match) {
      dueDate = fn(match);
      text = text.replace(re, '').trim();
      break;
    }
  }

  text = text.replace(/\s+/g, ' ').trim();
  return { title: text, priority, tags, dueDate };
}

// ============================================================
// EXPORT
// ============================================================
function exportData(format) {
  let content, filename, mime;
  const dateStr = toDateStr(new Date());

  if (format === 'json') {
    content = JSON.stringify(todos, null, 2);
    filename = `todos_${dateStr}.json`;
    mime = 'application/json';
  } else {
    // Markdown export
    const lines = [];
    lines.push('# 工作待办');
    lines.push(`> 导出日期: ${dateStr}`);
    lines.push('');
    function exportTree(parentId, depth) {
      const children = (parentId === null) ? getRootTasks() : getChildren(parentId);
      for (const t of children) {
        const check = t.status === 'completed' ? 'x' : ' ';
        const prio = t.priority ? ` [P${t.priority}]` : '';
        const date = t.dueDate ? ` 📅 ${t.dueDate}` : '';
        const tags = (t.tags||[]).length > 0 ? ' ' + t.tags.map(x=>'#'+x).join(' ') : '';
        lines.push(`${'  '.repeat(depth)}- [${check}] ${t.title}${prio}${date}${tags}`);
        exportTree(t.id, depth + 1);
      }
    }
    exportTree(null, 0);
    lines.push('');
    lines.push('---');
    lines.push('由 工作待办 App 导出');
    content = lines.join('\n');
    filename = `todos_${dateStr}.md`;
    mime = 'text/markdown';
  }

  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

  if (total > 0) {

  // ========================================

  // ========================================
  const s4 = pptx.addSlide();
  s4.background = { color: C.bg };
  s4.addText('甘特图', { x:0.5, y:0.3, w:5, h:0.5, fontSize:22, color:C.black, bold:true });

  const tasksWithDates = todos.filter(t => t.startDate || t.dueDate);
  if (tasksWithDates.length > 0) {
    // Draw gantt on canvas
    function fillRoundRect(gCtx, x, y, w, h, r) {
      r = Math.min(r, w/2, h/2);
      gCtx.beginPath();
      gCtx.moveTo(x+r, y); gCtx.lineTo(x+w-r, y);
      gCtx.arcTo(x+w, y, x+w, y+r, r);
      gCtx.lineTo(x+w, y+h-r); gCtx.arcTo(x+w, y+h, x+w-r, y+h, r);
      gCtx.lineTo(x+r, y+h); gCtx.arcTo(x, y+h, x, y+h-r, r);
      gCtx.lineTo(x, y+r); gCtx.arcTo(x, y, x+r, y, r);
      gCtx.closePath();
      gCtx.fill();
    }
    const gCanvas = document.createElement('canvas');
    const GW = 1200, GH = Math.max(300, tasksWithDates.length * 40 + 80);
    gCanvas.width = GW; gCanvas.height = GH;
    const gCtx = gCanvas.getContext('2d');
    gCtx.fillStyle = '#fafaf8'; gCtx.fillRect(0, 0, GW, GH);

    let gMin = null, gMax = null;
    for (const t of tasksWithDates) {
      const s = t.startDate ? new Date(t.startDate) : new Date(t.dueDate);
      const e = t.dueDate ? new Date(t.dueDate) : new Date(t.startDate);
      if (!gMin || s < gMin) gMin = s;
      if (!gMax || e > gMax) gMax = e;
    }
    gMin = new Date(gMin); gMin.setDate(gMin.getDate() - 2);
    gMax = new Date(gMax); gMax.setDate(gMax.getDate() + 2);
    const gDays = Math.ceil((gMax - gMin)/(1000*60*60*24)) + 1;
    const labelW = 200, barArea = GW - labelW - 20, dayW = Math.max(8, barArea / gDays);

    // Header
    gCtx.fillStyle = '#171717';
    gCtx.font = 'bold 11px Arial';
    for (let i = 0; i < gDays; i++) {
      const d = new Date(gMin); d.setDate(d.getDate() + i);
      if (d.getDate() === 1 || i === 0) {
        gCtx.fillText(`${d.getMonth()+1}/${d.getDate()}`, labelW + i*dayW, 30);
      }
    }
    gCtx.strokeStyle = '#e6e6e4'; gCtx.lineWidth = 0.5;
    gCtx.beginPath(); gCtx.moveTo(labelW, 38); gCtx.lineTo(GW-10, 38); gCtx.stroke();

    // Rows
    tasksWithDates.forEach((t, idx) => {
      const y = 52 + idx * 36;
      gCtx.fillStyle = '#171717';
      gCtx.font = '12px Arial';
      const label = t.title.length > 18 ? t.title.slice(0,17)+'…' : t.title;
      gCtx.fillText(label, 10, y + 16);

      const s = t.startDate ? new Date(t.startDate) : new Date(t.dueDate);
      const e = t.dueDate ? new Date(t.dueDate) : new Date(t.startDate);
      const sx = labelW + Math.max(0, Math.ceil((s - gMin)/(1000*60*60*24))) * dayW;
      const dur = Math.max(1, Math.ceil((e - s)/(1000*60*60*24)) + 1) * dayW;
      const barColor = t.status === 'completed' ? '#6b9e85' : t.status === 'in-progress' ? '#171717' : '#d0d0ce';
      gCtx.fillStyle = barColor;
      gCtx.beginPath();
      fillRoundRect(gCtx, sx, y + 4, Math.max(dur, 4), 20, 3);

      // Status dot
      gCtx.fillStyle = barColor;
      gCtx.beginPath(); gCtx.arc(labelW - 14, y + 14, 4, 0, Math.PI*2); gCtx.fill();
    });

    const ganttImg = gCanvas.toDataURL('image/png');
    s4.addImage({ data: ganttImg, x:0.3, y:1.0, w:12.7, h:5.8 });
  } else {
    s4.addText('暂无带日期的任务，无法生成甘特图', { x:0.5, y:2.5, w:12, h:1, fontSize:16, color:C.gray, align:'center' });
  }

  // ========================================
  // Slide 5: Task Details
  // ========================================
  const rootTasks = getRootTasks();
  const detailSlides = Math.ceil(rootTasks.length / 6);

  for (let si = 0; si < detailSlides; si++) {
    const sd = pptx.addSlide();
    sd.background = { color: C.bg };
    sd.addText(si === 0 ? '任务详情' : `任务详情 (续${si+1})`, { x:0.5, y:0.3, w:8, h:0.5, fontSize:22, color:C.black, bold:true });

    const pageTasks = rootTasks.slice(si * 6, (si + 1) * 6);
    let ty = 1.1;

    pageTasks.forEach(task => {
      const statusIcon = task.status === 'completed' ? '✓' : task.status === 'in-progress' ? '●' : '○';
      const prioStr = task.priority ? ` [P${task.priority}]` : '';
      const dateStr2 = task.dueDate ? ` 截止: ${task.dueDate}` : '';

      sd.addText(`${statusIcon} ${task.title}${prioStr}`, {
        x:0.5, y:ty, w:12, h:0.35, fontSize:13, bold:true, color:C.black
      });
      ty += 0.35;

      if (task.description) {
        sd.addText(task.description, { x:0.8, y:ty, w:11.5, h:0.3, fontSize:10, color:C.midGray });
        ty += 0.32;
      }

      const meta = [];
      meta.push(statusLabel(task.status));
      if (dateStr2) meta.push(dateStr2.trim());
      if ((task.tags||[]).length > 0) meta.push('标签: ' + task.tags.join(', '));
      const children = getChildren(task.id);
      if (children.length > 0) {
        const subsDone = children.filter(c => c.status === 'completed').length;
        meta.push(`子任务: ${subsDone}/${children.length} 完成`);
        children.slice(0, 5).forEach(c => {
          const cs = c.status === 'completed' ? '✓' : c.status === 'in-progress' ? '●' : '○';
          sd.addText(`  ${cs} ${c.title}`, { x:1.2, y:ty, w:11, h:0.28, fontSize:10, color:C.midGray });
          ty += 0.28;
        });
        if (children.length > 5) {
          sd.addText(`  ... 还有 ${children.length - 5} 个子任务`, { x:1.2, y:ty, w:11, h:0.28, fontSize:9, color:C.gray });
          ty += 0.28;
        }
      }

      sd.addText(meta.join('  |  '), { x:0.8, y:ty, w:11.5, h:0.28, fontSize:10, color:C.gray });
      ty += 0.45;
    });

    if (pageTasks.length === 0) {
      sd.addText('(暂无任务)', { x:0.5, y:2.5, w:12, h:1, fontSize:16, color:C.gray, align:'center' });
    }
  }

  // --- Download ---
  pptx.writeFile({ fileName: `工作报告_${toDateStr(new Date())}.pptx` })
    .catch(() => alert('PPT生成失败，请重试'));
}

// FOCUS TIMER
// ============================================================
let focusState = { taskId: null, total: 25*60, remaining: 25*60, running: false, timer: null };

function startFocus(taskId) {
  const task = getTask(taskId);
  if (!task) return;
  focusState.taskId = taskId;
  focusState.total = 25 * 60;
  focusState.remaining = 25 * 60;
  focusState.running = false;
  document.getElementById('focusTaskTitle').textContent = task.title;
  document.getElementById('focusOverlay').classList.add('show');
  document.getElementById('focusPlayBtn').textContent = '▶';
  updateFocusPresets(25);
  updateFocusDisplay();
  closeDetail();
}

function updateFocusDisplay() {
  const r = focusState.remaining;
  const mins = Math.floor(r / 60);
  const secs = r % 60;
  document.getElementById('focusTime').textContent =
    String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');

  const circumference = 2 * Math.PI * 100; // ~628.32
  const pct = focusState.remaining / focusState.total;
  const offset = circumference * (1 - pct);
  const ring = document.getElementById('focusRing');
  ring.setAttribute('stroke-dashoffset', offset);

  if (focusState.remaining <= 0) {
    ring.setAttribute('stroke', '#6b9e85');
    document.getElementById('focusTime').textContent = '✓';
    document.getElementById('focusPlayBtn').textContent = '▶';
    focusState.running = false;
    clearInterval(focusState.timer);
  } else if (focusState.running) {
    ring.setAttribute('stroke', '#fff');
  } else {
    ring.setAttribute('stroke', 'rgba(255,255,255,0.4)');
  }
}

function toggleFocus() {
  if (focusState.remaining <= 0) return;
  focusState.running = !focusState.running;
  document.getElementById('focusPlayBtn').textContent = focusState.running ? '⏸' : '▶';
  updateFocusDisplay();

  if (focusState.running) {
    focusState.timer = setInterval(() => {
      if (focusState.remaining > 0) {
        focusState.remaining--;
        updateFocusDisplay();
      }
      if (focusState.remaining <= 0) {
        clearInterval(focusState.timer);
        focusState.running = false;
        updateFocusDisplay();
      }
    }, 1000);
  } else {
    clearInterval(focusState.timer);
  }
}

function resetFocus() {
  clearInterval(focusState.timer);
  focusState.running = false;
  focusState.remaining = focusState.total;
  document.getElementById('focusPlayBtn').textContent = '▶';
  updateFocusDisplay();
}

function exitFocus() {
  clearInterval(focusState.timer);
  focusState.running = false;
  focusState.taskId = null;
  document.getElementById('focusOverlay').classList.remove('show');
}

function setFocusMinutes(min) {
  clearInterval(focusState.timer);
  focusState.total = min * 60;
  focusState.remaining = focusState.total;
  focusState.running = false;
  document.getElementById('focusPlayBtn').textContent = '▶';
  updateFocusPresets(min);
  updateFocusDisplay();
}

function updateFocusPresets(min) {
  document.querySelectorAll('.focus-preset-btn').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.min) === min);
  });
}

// RENDER: Task List
// ============================================================
function renderList() {
  const container = document.getElementById('listContent');
  let tasks = getRootTasks();

  // Auto-archive: "全部" excludes completed
  if (listFilterStatus === 'all') {
    tasks = tasks.filter(t => t.status !== 'completed');
    // Also filter descendants
    tasks = tasks.filter(t => {
      if (t.status !== 'completed') return true;
      return getDescendants(t.id).some(d => d.status !== 'completed');
    });
  } else {
    tasks = tasks.filter(t => {
      if (t.status === listFilterStatus) return true;
      return getDescendants(t.id).some(d => d.status === listFilterStatus);
    });
  }

  // Priority filter
  if (listFilterPriority !== 'all') {
    const p = parseInt(listFilterPriority);
    tasks = tasks.filter(t => t.priority === p || getDescendants(t.id).some(d => d.priority === p));
  }

  // Tag filter
  if (listFilterTag) {
    tasks = tasks.filter(t =>
      (t.tags||[]).includes(listFilterTag) ||
      getDescendants(t.id).some(d => (d.tags||[]).includes(listFilterTag))
    );
  }

  // Search
  if (listSearch) {
    const q = listSearch.toLowerCase();
    tasks = tasks.filter(t => {
      if (t.title.toLowerCase().includes(q)) return true;
      return getDescendants(t.id).some(d => d.title.toLowerCase().includes(q));
    });
  }

  document.getElementById('navCountTotal').textContent = getRootTasks().length;

  // Active tag chip
  const chip = document.getElementById('activeTagChip');
  if (listFilterTag) {
    chip.innerHTML = `<span class="active-tag-chip" onclick="clearTagFilter()">#${escHtml(listFilterTag)} <span class="tag-chip-x">×</span></span>`;
  } else {
    chip.innerHTML = '';
  }

  if (tasks.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">&#x2611;</div><p>暂无任务</p></div>`;
    return;
  }

  container.innerHTML = `<div class="task-tree">${tasks.map(t => renderTreeNode(t, 0)).join('')}</div>`;

  container.querySelectorAll('.expand-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const id = Number(this.dataset.id);
      if (expandedIds.has(id)) expandedIds.delete(id);
      else expandedIds.add(id);
      renderList();
    });
  });

  container.querySelectorAll('.task-row').forEach(row => {
    row.addEventListener('click', function() {
      openDetail(Number(this.dataset.id));
    });
  });

  if (window._newTaskId) {
    const newRow = container.querySelector(`.task-row[data-id="${window._newTaskId}"]`);
    if (newRow) {
      newRow.classList.add('card-enter');
      newRow.addEventListener('animationend', () => newRow.classList.remove('card-enter'), { once: true });
    }
    window._newTaskId = null;
  }
}

function renderTreeNode(task, depth) {
  const children = getChildren(task.id);
  const isExpanded = expandedIds.has(task.id);
  const hasKids = children.length > 0;
  const indent = depth * 20;
  const totalSubs = countSubtasks(task.id);
  const doneSubs = countCompletedSubtasks(task.id);
  const progressText = totalSubs > 0 ? `<span class="progress-tag">${doneSubs}/${totalSubs}</span>` : '';
  const dateText = task.startDate || task.dueDate
    ? `<span class="date-range">${formatDateShort(task.startDate)} → ${formatDateShort(task.dueDate)}</span>` : '';
  const expandBtn = hasKids
    ? `<button class="expand-btn ${isExpanded ? 'expanded' : ''}" data-id="${task.id}">&#x25B8;</button>`
    : `<button class="expand-btn placeholder">&#x25B8;</button>`;

  let rowClass = '';
  if (task.status === 'completed') rowClass = 'completed';
  else if (task.status === 'in-progress') rowClass = 'status-in-progress';
  if (task.priority === 1) rowClass += ' priority-p1';
  if (task.priority === 2) rowClass += ' priority-p2';
  if (task.priority === 3) rowClass += ' priority-p3';

  const priorityBadge = task.priority
    ? `<span class="priority-badge p${task.priority}">P${task.priority}</span>` : '';
  const tagChips = (task.tags||[]).length > 0
    ? `<div class="tag-chips">${task.tags.map(t => `<span class="tag-chip">${escHtml(t)}</span>`).join('')}</div>` : '';

  const html = `
    <div class="task-row ${rowClass.trim()}" data-id="${task.id}" style="margin-left:${indent}px;">
      ${expandBtn}
      <span class="status-dot ${task.status}"></span>
      <div class="task-row-body">
        <div class="task-row-title">${escHtml(task.title)}</div>
        <div class="task-row-meta">
          <span class="status-badge status-${task.status}">${statusLabel(task.status)}</span>
          ${priorityBadge}
          ${dateText}
          ${progressText}
        </div>
        ${tagChips}
      </div>
    </div>`;

  let childrenHtml = '';
  if (isExpanded && children.length > 0) {
    childrenHtml = children.map(c => renderTreeNode(c, depth + 1)).join('');
  }
  return html + childrenHtml;
}

function renderSidebarTags() {

// ============================================================
// RENDER: Daily Work
// ============================================================
function renderDaily() {
  const container = document.getElementById('dailyTasksContainer');
  document.getElementById('dailyDate').textContent =
    `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
  const todayStr = toDateStr(today);

  const activeTasks = todos.filter(t => {
    if (t.status !== 'in-progress') return false;
    if (hasChildren(t.id)) return false;
    if (t.startDate && t.startDate > todayStr) return false;
    if (t.dueDate && t.dueDate < todayStr) return false;
    return true;
  });
  const dueToday = todos.filter(t => {
    if (t.status === 'completed') return false;
    if (hasChildren(t.id)) return false;
    if (!t.dueDate || t.dueDate !== todayStr) return false;
    return !activeTasks.includes(t);
  });
  const startToday = todos.filter(t => {
    if (t.status !== 'not-started') return false;
    if (hasChildren(t.id)) return false;
    if (!t.startDate || t.startDate !== todayStr) return false;
    return !activeTasks.includes(t);
  });

  document.getElementById('navCountDaily').textContent = activeTasks.length;
  let html = '';
  if (activeTasks.length > 0) {
    html += `<div class="daily-section"><h3>进行中 (${activeTasks.length})</h3><div class="daily-list">`;
    html += activeTasks.map(t => renderDailyItem(t)).join('');
    html += `</div></div>`;
  }
  if (startToday.length > 0) {
    html += `<div class="daily-section"><h3>今日开始 (${startToday.length})</h3><div class="daily-list">`;
    html += startToday.map(t => renderDailyItem(t)).join('');
    html += `</div></div>`;
  }
  if (dueToday.length > 0) {
    html += `<div class="daily-section"><h3>今日截止 (${dueToday.length})</h3><div class="daily-list">`;
    html += dueToday.map(t => renderDailyItem(t)).join('');
    html += `</div></div>`;
  }
  if (!html) {
    html = `<div class="empty-state"><div class="empty-icon">&#x2611;</div><p>今日没有待处理的任务</p></div>`;
  }
  container.innerHTML = html;
  container.querySelectorAll('.daily-item').forEach(item => {
    item.addEventListener('click', () => openDetail(Number(item.dataset.id)));
  });
  loadDailyNote();
}

function renderDailyItem(task) {
  const parent = task.parentId ? getTask(task.parentId) : null;
  const parentText = parent ? `<span class="daily-item-parent">${escHtml(parent.title)}</span>` : '';
  return `
    <div class="daily-item" data-id="${task.id}">
      <span class="status-dot ${task.status}"></span>
      <div class="daily-item-body">
        <div class="daily-item-title">${escHtml(task.title)}</div>
        ${parentText}
      </div>
      <span style="font-size:12px; color:var(--text-muted);">${formatDateShort(task.dueDate) || '待定'}</span>
    </div>`;
}

// ============================================================
// RENDER: Calendar
// ============================================================
function renderCalendar() {
  const container = document.getElementById('calendarContent');
  const year = calendarYear, month = calendarMonth;
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startPad = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const todayStr = toDateStr(today);

  const dayTaskMap = {};
  for (const t of todos) {
    if (!t.startDate && !t.dueDate) continue;
    const start = t.startDate ? new Date(t.startDate) : new Date(2000, 0, 1);
    const end = t.dueDate ? new Date(t.dueDate) : new Date(2099, 11, 31);
    const iter = new Date(start);
    while (iter <= end) {
      const key = toDateStr(iter);
      if (!dayTaskMap[key]) dayTaskMap[key] = [];
      dayTaskMap[key].push(t);
      iter.setDate(iter.getDate() + 1);
    }
  }

  let html = `<div class="calendar-nav">
    <button class="btn btn-ghost btn-sm" onclick="changeCalendarMonth(-1)">&#x25C0;</button>
    <h3>${year}年 ${month+1}月</h3>
    <button class="btn btn-ghost btn-sm" onclick="changeCalendarMonth(1)">&#x25B6;</button>
    <button class="btn btn-ghost btn-sm" onclick="goToToday()">今天</button>
  </div><div class="calendar-grid">`;

  html += ['日','一','二','三','四','五','六'].map(d => `<div class="calendar-day-header">${d}</div>`).join('');
  for (let i = 0; i < startPad; i++) html += `<div class="calendar-day other-month"><div class="day-num"></div></div>`;

  for (let d = 1; d <= totalDays; d++) {
    const date = new Date(year, month, d);
    const dateStr = toDateStr(date);
    const isToday = dateStr === todayStr;
    const tasksOnDay = dayTaskMap[dateStr] || [];
    const unique = []; const seen = new Set();
    for (const t of tasksOnDay) { if (!seen.has(t.id)) { seen.add(t.id); unique.push(t); } }
    const dots = unique.slice(0, 10);
    html += `<div class="calendar-day ${isToday ? 'today' : ''}" data-date="${dateStr}">
      <div class="day-num">${d}</div>
      <div class="calendar-dots">${dots.map(t => `<span class="calendar-dot ${t.status}" title="${escHtml(t.title)}"></span>`).join('')}</div>
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
  container.querySelectorAll('.calendar-day[data-date]').forEach(cell => {
    cell.addEventListener('click', function(e) { showCalendarPopover(this.dataset.date, e); });
  });
}

function showCalendarPopover(dateStr, event) {
  const popover = document.getElementById('calendarPopover');
  const tasksOnDay = todos.filter(t => {
    if (!t.startDate && !t.dueDate) return false;
    const start = t.startDate || '2000-01-01';
    const end = t.dueDate || '2099-12-31';
    return dateStr >= start && dateStr <= end;
  });
  const d = new Date(dateStr);
  let html = `<h4>${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日</h4>`;
  if (tasksOnDay.length === 0) {
    html += `<div style="font-size:13px; color:var(--text-muted); padding:8px;">暂无任务</div>`;
  } else {
    html += tasksOnDay.map(t =>
      `<div class="popover-task" data-id="${t.id}">
        <span class="status-dot ${t.status}"></span>
        <span>${escHtml(t.title)}</span>
        <span class="status-badge status-${t.status}" style="margin-left:auto;">${statusLabel(t.status)}</span>
      </div>`).join('');
  }
  popover.innerHTML = html;
  popover.classList.add('show');
  const rect = event.target.getBoundingClientRect();
  let left = rect.left, top = rect.bottom + 4;
  if (left + 300 > window.innerWidth) left = window.innerWidth - 310;
  if (top + 200 > window.innerHeight) top = rect.top - 210;
  popover.style.left = left + 'px';
  popover.style.top = top + 'px';
  calendarPopoverDay = dateStr;
  popover.querySelectorAll('.popover-task').forEach(el => {
    el.addEventListener('click', () => { hideCalendarPopover(); openDetail(Number(el.dataset.id)); });
  });
}

function hideCalendarPopover() {
  document.getElementById('calendarPopover').classList.remove('show');
  calendarPopoverDay = null;
}

function changeCalendarMonth(delta) {
  calendarMonth += delta;
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  renderCalendar();
}

function goToToday() {
  calendarYear = today.getFullYear();
  calendarMonth = today.getMonth();
  renderCalendar();
}

// ============================================================
// RENDER: Gantt
// ============================================================
function renderGantt() {
  const container = document.getElementById('ganttContent');
  container.innerHTML = '';
  const tasksWithDates = todos.filter(t => t.startDate || t.dueDate);
  if (tasksWithDates.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">&#x29D6;</div><p>暂无带日期的任务，无法生成甘特图</p></div>`;
    return;
  }
  let minDate = null, maxDate = null;
  for (const t of tasksWithDates) {
    const s = t.startDate ? new Date(t.startDate) : new Date(t.dueDate);
    const e = t.dueDate ? new Date(t.dueDate) : new Date(t.startDate);
    if (!minDate || s < minDate) minDate = s;
    if (!maxDate || e > maxDate) maxDate = e;
  }
  minDate = new Date(minDate); minDate.setDate(minDate.getDate() - 3);
  maxDate = new Date(maxDate); maxDate.setDate(maxDate.getDate() + 3);
  const totalDays = Math.ceil((maxDate - minDate) / (1000 * 60 * 60 * 24)) + 1;
  const dayWidth = 30;
  const months = [];
  const current = new Date(minDate);
  while (current <= maxDate) {
    months.push({ year: current.getFullYear(), month: current.getMonth() });
    current.setMonth(current.getMonth() + 1);
  }
  const datedTasks = [], undatedTasks = [];
  function collectTree(parentId, depth) {
    const children = (parentId === null) ? getRootTasks() : getChildren(parentId);
    for (const t of children) {
      if (t.startDate || t.dueDate) { datedTasks.push({ ...t, depth }); collectTree(t.id, depth + 1); }
      else { undatedTasks.push({ ...t, depth }); collectTree(t.id, depth + 1); }
    }
  }
  collectTree(null, 0);

  let html = `<div class="gantt-chart" style="min-width:${220 + totalDays * dayWidth}px;">`;
  html += `<div class="gantt-month-row"><div class="gantt-label-col">月份</div>`;
  for (const m of months) {
    const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();
    const monthStart = new Date(m.year, m.month, 1);
    const offsetDays = Math.ceil((monthStart - minDate) / (1000 * 60 * 60 * 24));
    const visibleDays = Math.min(daysInMonth, totalDays - offsetDays);
    if (visibleDays > 0) {
      html += `<div class="gantt-month-cell" style="flex:${visibleDays}; min-width:${visibleDays * dayWidth}px;">${m.year}/${m.month+1}</div>`;
    }
  }
  html += `</div>`;
  html += `<div class="gantt-header"><div class="gantt-label-col">任务</div><div class="gantt-timeline-col">`;
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(minDate); d.setDate(d.getDate() + i);
    html += `<div class="gantt-day-cell" style="min-width:${dayWidth}px; ${d.getDay()===0||d.getDay()===6?'color:#d1d5db;':''}">${d.getDate()}</div>`;
  }
  html += `</div></div>`;
  if (datedTasks.length > 0) {
    html += `<div class="gantt-section-title">有日期任务</div>`;
    html += datedTasks.map(t => renderGanttRow(t, minDate, totalDays, dayWidth)).join('');
  }
  if (undatedTasks.length > 0) {
    html += `<div class="gantt-section-title" style="margin-top:12px;">待定日期</div>`;
    html += undatedTasks.map(t => renderGanttRow(t, minDate, totalDays, dayWidth)).join('');
  }
  html += `</div>`;
  container.innerHTML = html;
  container.querySelectorAll('.gantt-row-label, .gantt-bar').forEach(el => {
    el.addEventListener('click', () => openDetail(Number(el.dataset.id)));
  });
}

function renderGanttRow(task, minDate, totalDays, dayWidth) {
  const indent = task.depth * 16;
  const start = task.startDate ? new Date(task.startDate) : new Date(task.dueDate);
  const end = task.dueDate ? new Date(task.dueDate) : new Date(task.startDate);
  const startOffset = Math.ceil((start - minDate) / (1000 * 60 * 60 * 24));
  const duration = Math.max(1, Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1);
  return `<div class="gantt-row">
    <div class="gantt-row-label" data-id="${task.id}" style="padding-left:${12 + indent}px;">
      <span class="status-dot ${task.status}"></span>
      <span style="overflow:hidden; text-overflow:ellipsis;">${escHtml(task.title)}</span>
    </div>
    <div class="gantt-row-bars">
      ${Array.from({length: totalDays}, (_, i) => `<div class="gantt-bar-cell" style="min-width:${dayWidth}px;"></div>`).join('')}
      <div class="gantt-bar ${task.status}" data-id="${task.id}"
           style="left:${startOffset * dayWidth}px; width:${duration * dayWidth - 4}px;"
           title="${escHtml(task.title)}: ${task.startDate || '?'} → ${task.dueDate || '?'}"></div>
    </div>
  </div>`;
}
