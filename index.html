  const year = calendarYear, month = calendarMonth;
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startPad = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const todayStr = toDateStr(today);

  const dayTaskMap = {};
  for (const t of todos) {
    if (!t.startDate && !t.dueDate) continue;
    const start = t.startDate ? new Date(t.startDate) : new Date(2000, 0, 1);
    const end = t.dueDate ? new Date(t.dueDate) : new Date(2099, 11, 31);
    const iter = new Date(start);
    while (iter <= end) {
      const key = toDateStr(iter);
      if (!dayTaskMap[key]) dayTaskMap[key] = [];
      dayTaskMap[key].push(t);
      iter.setDate(iter.getDate() + 1);
    }
  }

  let html = `<div class="calendar-nav">
    <button class="btn btn-ghost btn-sm" onclick="changeCalendarMonth(-1)">&#x25C0;</button>
    <h3>${year}年 ${month+1}月</h3>
    <button class="btn btn-ghost btn-sm" onclick="changeCalendarMonth(1)">&#x25B6;</button>
    <button class="btn btn-ghost btn-sm" onclick="goToToday()">今天</button>
  </div><div class="calendar-grid">`;

  html += ['日','一','二','三','四','五','六'].map(d => `<div class="calendar-day-header">${d}</div>`).join('');
  for (let i = 0; i < startPad; i++) html += `<div class="calendar-day other-month"><div class="day-num"></div></div>`;

  for (let d = 1; d <= totalDays; d++) {
    const date = new Date(year, month, d);
    const dateStr = toDateStr(date);
    const isToday = dateStr === todayStr;
    const tasksOnDay = dayTaskMap[dateStr] || [];
    const unique = []; const seen = new Set();
    for (const t of tasksOnDay) { if (!seen.has(t.id)) { seen.add(t.id); unique.push(t); } }
    const dots = unique.slice(0, 10);
    html += `<div class="calendar-day ${isToday ? 'today' : ''}" data-date="${dateStr}">
      <div class="day-num">${d}</div>
      <div class="calendar-dots">${dots.map(t => `<span class="calendar-dot ${t.status}" title="${escHtml(t.title)}"></span>`).join('')}</div>
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
  container.querySelectorAll('.calendar-day[data-date]').forEach(cell => {
    cell.addEventListener('click', function(e) { showCalendarPopover(this.dataset.date, e); });
  });
}

function showCalendarPopover(dateStr, event) {
  const popover = document.getElementById('calendarPopover');
  const tasksOnDay = todos.filter(t => {
    if (!t.startDate && !t.dueDate) return false;
    const start = t.startDate || '2000-01-01';
    const end = t.dueDate || '2099-12-31';
    return dateStr >= start && dateStr <= end;
  });
  const d = new Date(dateStr);
  let html = `<h4>${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日</h4>`;
  if (tasksOnDay.length === 0) {
    html += `<div style="font-size:13px; color:var(--text-muted); padding:8px;">暂无任务</div>`;
  } else {
    html += tasksOnDay.map(t =>
      `<div class="popover-task" data-id="${t.id}">
        <span class="status-dot ${t.status}"></span>
        <span>${escHtml(t.title)}</span>
        <span class="status-badge status-${t.status}" style="margin-left:auto;">${statusLabel(t.status)}</span>
      </div>`).join('');
  }
  popover.innerHTML = html;
  popover.classList.add('show');
  const rect = event.target.getBoundingClientRect();
  let left = rect.left, top = rect.bottom + 4;
  if (left + 300 > window.innerWidth) left = window.innerWidth - 310;
  if (top + 200 > window.innerHeight) top = rect.top - 210;
  popover.style.left = left + 'px';
  popover.style.top = top + 'px';
  calendarPopoverDay = dateStr;
  popover.querySelectorAll('.popover-task').forEach(el => {
    el.addEventListener('click', () => { hideCalendarPopover(); openDetail(Number(el.dataset.id)); });
  });
}

function hideCalendarPopover() {
  document.getElementById('calendarPopover').classList.remove('show');
  calendarPopoverDay = null;
}

function changeCalendarMonth(delta) {
  calendarMonth += delta;
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  renderCalendar();
}

function goToToday() {
  calendarYear = today.getFullYear();
  calendarMonth = today.getMonth();
  renderCalendar();
}

// ============================================================
// RENDER: Gantt
// ============================================================
function renderGantt() {
  const container = document.getElementById('ganttContent');
  container.innerHTML = '';
  const tasksWithDates = todos.filter(t => t.startDate || t.dueDate);
  if (tasksWithDates.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">&#x29D6;</div><p>暂无带日期的任务，无法生成甘特图</p></div>`;
    return;
  }
  let minDate = null, maxDate = null;
  for (const t of tasksWithDates) {
    const s = t.startDate ? new Date(t.startDate) : new Date(t.dueDate);
    const e = t.dueDate ? new Date(t.dueDate) : new Date(t.startDate);
    if (!minDate || s < minDate) minDate = s;
    if (!maxDate || e > maxDate) maxDate = e;
  }
  minDate = new Date(minDate); minDate.setDate(minDate.getDate() - 3);
  maxDate = new Date(maxDate); maxDate.setDate(maxDate.getDate() + 3);
  const totalDays = Math.ceil((maxDate - minDate) / (1000 * 60 * 60 * 24)) + 1;
  const dayWidth = 30;
  const months = [];
  const current = new Date(minDate);
  while (current <= maxDate) {
    months.push({ year: current.getFullYear(), month: current.getMonth() });
    current.setMonth(current.getMonth() + 1);
  }
  const datedTasks = [], undatedTasks = [];
  function collectTree(parentId, depth) {
    const children = (parentId === null) ? getRootTasks() : getChildren(parentId);
    for (const t of children) {
      if (t.startDate || t.dueDate) { datedTasks.push({ ...t, depth }); collectTree(t.id, depth + 1); }
      else { undatedTasks.push({ ...t, depth }); collectTree(t.id, depth + 1); }
    }
  }
  collectTree(null, 0);

  let html = `<div class="gantt-chart" style="min-width:${220 + totalDays * dayWidth}px;">`;
  html += `<div class="gantt-month-row"><div class="gantt-label-col">月份</div>`;
  for (const m of months) {
    const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();
    const monthStart = new Date(m.year, m.month, 1);
    const offsetDays = Math.ceil((monthStart - minDate) / (1000 * 60 * 60 * 24));
    const visibleDays = Math.min(daysInMonth, totalDays - offsetDays);
    if (visibleDays > 0) {
      html += `<div class="gantt-month-cell" style="flex:${visibleDays}; min-width:${visibleDays * dayWidth}px;">${m.year}/${m.month+1}</div>`;
    }
  }
  html += `</div>`;
  html += `<div class="gantt-header"><div class="gantt-label-col">任务</div><div class="gantt-timeline-col">`;
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(minDate); d.setDate(d.getDate() + i);
    html += `<div class="gantt-day-cell" style="min-width:${dayWidth}px; ${d.getDay()===0||d.getDay()===6?'color:#d1d5db;':''}">${d.getDate()}</div>`;
  }
  html += `</div></div>`;
  if (datedTasks.length > 0) {
    html += `<div class="gantt-section-title">有日期任务</div>`;
    html += datedTasks.map(t => renderGanttRow(t, minDate, totalDays, dayWidth)).join('');
  }
  if (undatedTasks.length > 0) {
    html += `<div class="gantt-section-title" style="margin-top:12px;">待定日期</div>`;
    html += undatedTasks.map(t => renderGanttRow(t, minDate, totalDays, dayWidth)).join('');
  }
  html += `</div>`;
  container.innerHTML = html;
  container.querySelectorAll('.gantt-row-label, .gantt-bar').forEach(el => {
    el.addEventListener('click', () => openDetail(Number(el.dataset.id)));
  });
}

function renderGanttRow(task, minDate, totalDays, dayWidth) {
  const indent = task.depth * 16;
  const start = task.startDate ? new Date(task.startDate) : new Date(task.dueDate);
  const end = task.dueDate ? new Date(task.dueDate) : new Date(task.startDate);
  const startOffset = Math.ceil((start - minDate) / (1000 * 60 * 60 * 24));
  const duration = Math.max(1, Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1);
  return `<div class="gantt-row">
    <div class="gantt-row-label" data-id="${task.id}" style="padding-left:${12 + indent}px;">
      <span class="status-dot ${task.status}"></span>
      <span style="overflow:hidden; text-overflow:ellipsis;">${escHtml(task.title)}</span>
    </div>
    <div class="gantt-row-bars">
      ${Array.from({length: totalDays}, (_, i) => `<div class="gantt-bar-cell" style="min-width:${dayWidth}px;"></div>`).join('')}
      <div class="gantt-bar ${task.status}" data-id="${task.id}"
           style="left:${startOffset * dayWidth}px; width:${duration * dayWidth - 4}px;"
           title="${escHtml(task.title)}: ${task.startDate || '?'} → ${task.dueDate || '?'}"></div>
    </div>
  </div>`;
}

// RENDER: Detail Panel
// ============================================================
function openDetail(id) {
  detailTaskId = id;
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
  renderDetail();
}

function closeDetail() {
  detailTaskId = null;
  document.getElementById('detailPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  hideCalendarPopover();
  renderAll();
}

function renderDetail() {
  const task = getTask(detailTaskId);
  if (!task) return;
  const body = document.getElementById('detailBody');
  const children = getChildren(task.id);
  const ancestors = getAncestors(task.id);

  let statusButtons = '';
  ['not-started', 'in-progress', 'completed'].forEach(s => {
    const active = task.status === s ? ' active' : '';
    statusButtons += `<button class="${active}" data-status="${s}" onclick="updateTaskStatus(${task.id}, '${s}')">${statusLabel(s)}</button>`;
  });

  let priorityButtons = '';
  [null, 1, 2, 3].forEach(p => {
    const label = p === null ? '无' : 'P' + p;
    const cls = (p === 1 ? 'p1' : p === 2 ? 'p2' : p === 3 ? 'p3' : '') + (task.priority === p ? ' active' : '');
    priorityButtons += `<button class="${cls}" data-priority="${p === null ? '' : p}" onclick="updateTask(${task.id}, {priority: ${p === null ? 'null' : p}}); renderDetail();">${label}</button>`;
  });

  let ancestorsHtml = '';
  if (ancestors.length > 0) {
    ancestorsHtml = `<div class="detail-field"><label>父任务</label>
      <div style="display:flex; gap:4px; flex-wrap:wrap;">
        ${ancestors.map(a => `<span class="badge" style="cursor:pointer;" onclick="openDetail(${a.id})">${escHtml(a.title)}</span>`).join('')}
      </div></div>`;
  }

  const tagStr = (task.tags||[]).join(', ');
  const tagEditHtml = `
    <div class="detail-field">
      <label>标签</label>
      <div class="tag-edit-wrap" id="tagEditWrap">
        ${(task.tags||[]).map(t => `<span class="tag-edit-chip">${escHtml(t)}<span class="tag-remove" onclick="event.stopPropagation(); removeTagFromTask(${task.id},'${escHtml(t)}')">×</span></span>`).join('')}
      </div>
      <input type="text" value="${escHtml(tagStr)}" placeholder="逗号分隔，如 设计, 前端"
             onchange="updateTaskTags(${task.id}, this.value); renderDetail();" style="margin-top:4px;">
    </div>`;

  let subtaskHtml = `
    <div class="detail-subtasks">
      <h4>子任务 <span style="font-weight:400;color:var(--text-muted);">(${children.length})</span></h4>
      <div class="subtask-list">
        ${children.map(c => `
          <div class="subtask-item ${c.status === 'completed' ? 'completed' : ''}" onclick="openDetail(${c.id})">
            <span class="status-dot ${c.status}"></span>
            <span class="subtask-title">${escHtml(c.title)}</span>
            <span style="margin-left:auto; font-size:11px; color:var(--text-muted);">${formatDateShort(c.dueDate) || ''}</span>
          </div>`).join('')}
      </div>
      <form class="add-subtask-form" onsubmit="addSubtask(event, ${task.id})">
        <input type="text" placeholder="添加子任务..." required>
        <button type="submit" class="btn btn-primary btn-sm">添加</button>
      </form>
    </div>`;

  body.innerHTML = `
    <div class="detail-field">
      <label>任务标题</label>
      <input type="text" value="${escHtml(task.title)}" onchange="updateTask(${task.id}, {title: this.value})">
    </div>
    <div class="detail-field">
      <label>状态</label>
      <div class="status-select">${statusButtons}</div>
    </div>
    <div class="detail-field">
      <label>优先级</label>
      <div class="priority-select">${priorityButtons}</div>
    </div>
    <div style="display:flex; gap:12px;">
      <div class="detail-field" style="flex:1;">
        <label>起始日期</label>
        <input type="date" value="${task.startDate || ''}" onchange="updateTask(${task.id}, {startDate: this.value || null})">
      </div>
      <div class="detail-field" style="flex:1;">
        <label>截止日期</label>
        <input type="date" value="${task.dueDate || ''}" onchange="updateTask(${task.id}, {dueDate: this.value || null})">
      </div>
    </div>
    <button class="btn btn-ghost btn-sm" style="align-self:flex-start;" onclick="updateTask(${task.id}, {startDate: null, dueDate: null}); renderDetail();">设为待定</button>
    <div class="detail-field">
      <label>描述</label>
      <textarea placeholder="添加描述..." onchange="updateTask(${task.id}, {description: this.value})">${escHtml(task.description || '')}</textarea>
    </div>
    ${ancestorsHtml}
    ${tagEditHtml}
    ${subtaskHtml}
    <div style="display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
      <button class="btn-focus" onclick="startFocus(${task.id})">⏱ 专注模式</button>
      <button class="btn btn-danger btn-sm" onclick="deleteTaskConfirm(${task.id})">删除此任务</button>
    </div>
  `;
}

function removeTagFromTask(id, tag) {
  const task = getTask(id);
  if (!task) return;
  const tags = (task.tags||[]).filter(t => t !== tag);
  updateTask(id, { tags });
}

async function addSubtask(event, parentId) {
  event.preventDefault();
  const input = event.target.querySelector('input');
  const title = input.value.trim();
  if (!title) return;
  const task = await addTask(title, parentId);
  const parent = getTask(parentId);
  if (parent) {
    await updateTask(task.id, { startDate: parent.startDate, dueDate: parent.dueDate });
  }
  input.value = '';
  renderDetail();
  renderAll();
}

async function updateTaskStatus(id, status) {
  const task = getTask(id);
  if (!task) return;
  if (status === 'in-progress' && !task.startDate) task.startDate = toDateStr(new Date());
  if (status === 'completed' && !task.dueDate) task.dueDate = toDateStr(new Date());
  await updateTask(id, { status });
  renderDetail();
}

async function deleteTaskConfirm(id) {
  const task = getTask(id);
  const count = 1 + getDescendants(id).length;
  const msg = count > 1 ? `确定删除"${task.title}"及其 ${count - 1} 个子任务？` : `确定删除"${task.title}"？`;
  if (confirm(msg)) { closeDetail(); await deleteTask(id); }
}

function updateSidebarDate() {
  const now = new Date();
  const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  document.getElementById('sidebarDate').textContent =
    `${now.getMonth()+1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;
}

function updateSidebarProgress() {
  const todayStr = toDateStr(today);
  const relevant = todos.filter(t => {
    if (!t.startDate && !t.dueDate) return false;
    if (t.startDate && t.startDate > todayStr) return false;
    if (t.dueDate && t.dueDate < todayStr) return false;
    return true;
  });
  const total = relevant.length;
  const done = relevant.filter(t => t.status === 'completed').length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const ring = document.getElementById('progressRing');
  const text = document.getElementById('progressText');
  const circumference = 2 * Math.PI * 22;
  if (total === 0) {
    ring.setAttribute('stroke-dashoffset', circumference);
    text.textContent = '--';
  } else {
    ring.setAttribute('stroke-dashoffset', circumference - (pct / 100) * circumference);
    text.textContent = pct + '%';
  }
}

let miscHistoryRange = 'week'; // today | week | month | all
let miscHistoryTypeFilter = 'all';
let editingMiscTypeId = null;
let editingMiscRecordId = null;
let miscTypeColorPick = MISC_COLOR_PALETTE[0];

function activeMiscTypes() {
  return miscTypes.filter(t => !t.archived).sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));
}

function sumRecordsForType(typeId, sinceStr, untilStr) {
  return miscRecords
    .filter(r => r.typeId === typeId && r.occurredAt >= sinceStr && r.occurredAt <= untilStr)
    .reduce((sum, r) => sum + (r.count || 0), 0);
}

function todayCountForType(typeId) {
  const t = toDateStr(new Date());
  return sumRecordsForType(typeId, t, t);
}

function rangeDates(range) {
  const now = new Date();
  const todayStr = toDateStr(now);
  if (range === 'today') return { from: todayStr, to: todayStr };
  if (range === 'week') {
    const d = new Date(now);
    const dow = (d.getDay() + 6) % 7; // Monday = 0
    d.setDate(d.getDate() - dow);
    return { from: toDateStr(d), to: todayStr };
  }
  if (range === 'month') {
    const d = new Date(now.getFullYear(), now.getMonth(), 1);
    return { from: toDateStr(d), to: todayStr };
  }
  if (range === '30d') {
    const d = new Date(now);
    d.setDate(d.getDate() - 29);
    return { from: toDateStr(d), to: todayStr };
  }
  return { from: '0000-01-01', to: '9999-12-31' };
}

function renderMisc() {
  const c = document.getElementById('miscContent');
  const types = activeMiscTypes();

  let html = '<div class="misc-section-label">今日累计</div>';

  // Card grid
  html += '<div class="misc-card-grid">';
  if (types.length === 0) {
    html += `<div class="misc-card-add" onclick="openMiscTypeModal(null)">+ 新建第一个类型</div>`;
  } else {
    for (const t of types) {
      const today = todayCountForType(t.id);
      html += `
        <div class="misc-card" style="border-left-color:${escHtml(t.color)};">
          <div class="misc-card-header">
            <span class="misc-card-icon">${escHtml(t.icon)}</span>
            <span class="misc-card-name">${escHtml(t.name)}</span>
            <button class="misc-card-menu" onclick="openMiscTypeModal('${t.id}')" title="编辑类型">⋯</button>
          </div>
          <div class="misc-card-count">${today} <span class="unit">${escHtml(t.unit)}</span></div>
          <div class="misc-card-meta">今日已记录</div>
          <div class="misc-card-actions">
            <button class="btn btn-primary btn-sm" onclick="quickAddMiscRecord('${t.id}')">+1</button>
            <button class="btn btn-ghost btn-sm" onclick="openMiscRecordModal(null, '${t.id}')">+N</button>
          </div>
        </div>`;
    }
    html += `<div class="misc-card-add" onclick="openMiscTypeModal(null)">+ 新建类型</div>`;
  }
  html += '</div>';

  // Today summary line
  if (types.length > 0) {
    const items = types.map(t => {
      const c = todayCountForType(t.id);
      return c > 0 ? `<span class="summary-item">${escHtml(t.icon)} ${escHtml(t.name)} ${c} ${escHtml(t.unit)}</span>` : null;
    }).filter(Boolean);
    if (items.length > 0) {
      html += `<div class="misc-summary-line">${items.join('<span class="summary-sep">·</span>')}</div>`;
    } else {
      html += `<div class="misc-summary-line">今日尚无记录</div>`;
    }
  }

  // History
  html += '<div class="misc-section-label">历史记录</div>';
  html += `
    <div class="misc-history-toolbar">
      <select id="miscHistRange" onchange="miscHistoryRange=this.value; renderMisc();">
        <option value="today"${miscHistoryRange==='today'?' selected':''}>今日</option>
        <option value="week"${miscHistoryRange==='week'?' selected':''}>本周</option>
        <option value="month"${miscHistoryRange==='month'?' selected':''}>本月</option>
        <option value="30d"${miscHistoryRange==='30d'?' selected':''}>最近 30 天</option>
        <option value="all"${miscHistoryRange==='all'?' selected':''}>全部</option>
      </select>
      <select id="miscHistType" onchange="miscHistoryTypeFilter=this.value; renderMisc();">
        <option value="all">全部类型</option>
        ${miscTypes.map(t => `<option value="${t.id}"${miscHistoryTypeFilter===t.id?' selected':''}>${escHtml(t.icon)} ${escHtml(t.name)}</option>`).join('')}
      </select>
    </div>`;

  const { from, to } = rangeDates(miscHistoryRange);
  let rows = miscRecords.filter(r => r.occurredAt >= from && r.occurredAt <= to);
  if (miscHistoryTypeFilter !== 'all') rows = rows.filter(r => r.typeId === miscHistoryTypeFilter);
  rows.sort((a,b) => {
    if (a.occurredAt !== b.occurredAt) return b.occurredAt.localeCompare(a.occurredAt);
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });
  rows = rows.slice(0, 100);

  html += '<div class="misc-history-list">';
  if (rows.length === 0) {
    html += '<div class="misc-history-empty">暂无记录</div>';
  } else {
    for (const r of rows) {
      const t = miscTypes.find(x => x.id === r.typeId);
      const tagBg = t ? hexWithAlpha(t.color, 0.18) : 'var(--accent-subtle)';
      const tagColor = t ? t.color : 'var(--text-secondary)';
      html += `
        <div class="misc-history-row">
          <span class="misc-history-date">${formatDateShort(r.occurredAt)}</span>
          <span class="misc-history-type" style="background:${tagBg};color:${tagColor};">
            ${t ? escHtml(t.icon) + ' ' + escHtml(t.name) : '(已删除)'}
          </span>
          <span class="misc-history-count">${r.count} ${t ? escHtml(t.unit) : ''}</span>
          <span class="misc-history-note" title="${escHtml(r.note || '')}">${escHtml(r.note || '')}</span>
          <span class="misc-history-actions">
            <button onclick="openMiscRecordModal('${r.id}', null)" title="编辑">✎</button>
            <button onclick="deleteMiscRecordQuick('${r.id}')" title="删除">✕</button>
          </span>
        </div>`;
    }
  }
  html += '</div>';

  c.innerHTML = html;
}

function hexWithAlpha(hex, alpha) {
  if (!hex || !hex.startsWith('#')) return `rgba(184,150,90,${alpha})`;
  const h = hex.slice(1);
  const r = parseInt(h.slice(0,2), 16);
  const g = parseInt(h.slice(2,4), 16);
  const b = parseInt(h.slice(4,6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ---- Type Modal ----
function openMiscTypeModal(id) {
  editingMiscTypeId = id;
  const modal = document.getElementById('miscTypeModal');
  const title = document.getElementById('miscTypeModalTitle');
  const delBtn = document.getElementById('miscTypeDeleteBtn');
  const archField = document.getElementById('miscTypeArchiveField');

  const palette = document.getElementById('miscTypeColorPicker');
  palette.innerHTML = MISC_COLOR_PALETTE.map(c =>
    `<div class="color-swatch" style="background:${c};" data-color="${c}" onclick="pickMiscColor('${c}')"></div>`
  ).join('');

  if (id) {
    const t = miscTypes.find(x => x.id === id);
    if (!t) return;
    title.textContent = '编辑任务集类型';
    document.getElementById('miscTypeName').value = t.name;
    document.getElementById('miscTypeIcon').value = t.icon;
    document.getElementById('miscTypeUnit').value = t.unit;
    document.getElementById('miscTypeSort').value = t.sortOrder;
    document.getElementById('miscTypeArchived').checked = t.archived;
    miscTypeColorPick = t.color;
    delBtn.style.display = '';
    archField.style.display = '';
  } else {
    title.textContent = '新建任务集类型';
    document.getElementById('miscTypeName').value = '';
    document.getElementById('miscTypeIcon').value = '📌';
    document.getElementById('miscTypeUnit').value = '次';
    document.getElementById('miscTypeSort').value = miscTypes.length;
    document.getElementById('miscTypeArchived').checked = false;

    delBtn.style.display = 'none';
    archField.style.display = 'none';
  }
  pickMiscColor(miscTypeColorPick);
  modal.classList.add('show');
  setTimeout(() => document.getElementById('miscTypeName').focus(), 50);
}

function pickMiscColor(c) {
  miscTypeColorPick = c;
  document.querySelectorAll('#miscTypeColorPicker .color-swatch').forEach(el => {
    el.classList.toggle('active', el.dataset.color === c);
  });
}

function closeMiscTypeModal() {
  document.getElementById('miscTypeModal').classList.remove('show');
  editingMiscTypeId = null;
}

async function saveMiscType() {
  const name = document.getElementById('miscTypeName').value.trim();
  if (!name) { showToast('请输入名称'); return; }
  const data = {
    name,
    icon: document.getElementById('miscTypeIcon').value.trim() || '📌',
    color: miscTypeColorPick,
    unit: document.getElementById('miscTypeUnit').value.trim() || '次',
    sortOrder: parseInt(document.getElementById('miscTypeSort').value) || 0,
    archived: document.getElementById('miscTypeArchived').checked
  };
  if (editingMiscTypeId) {
    await updateMiscType(editingMiscTypeId, data);
  } else {
    const t = await addMiscType(data);
    if (!t) return;
  }
  closeMiscTypeModal();
  renderMisc();
  updateNavBadges();
}

async function deleteMiscTypeConfirm() {
  if (!editingMiscTypeId) return;
  const t = miscTypes.find(x => x.id === editingMiscTypeId);
  const recordCount = miscRecords.filter(r => r.typeId === editingMiscTypeId).length;
  const msg = recordCount > 0
    ? `确认删除"${t.name}"？将同时删除 ${recordCount} 条历史记录，不可恢复。`
    : `确认删除"${t.name}"？`;

  await deleteMiscType(editingMiscTypeId);

  renderMisc();

let reportRange = 'week';
let reportFromDate = null;
let reportToDate = null;
let reportSelectedTypes = new Set();
let reportTrendTypeId = null;
let reportCharts = { bar: null, pie: null, line: null };

async function ensureChartJs() {
  if (typeof Chart !== 'undefined') return true;
  // Defer attribute may still be loading; wait briefly
  for (let i = 0; i < 30; i++) {
    if (typeof Chart !== 'undefined') return true;
    await new Promise(r => setTimeout(r, 100));
  }
  if (typeof Chart === 'undefined') {
    showToast('图表库加载失败，请检查网络');
    return false;
  }
  return true;
}

function reportEffectiveRange() {
  if (reportRange === 'custom' && reportFromDate && reportToDate) {
    return { from: reportFromDate, to: reportToDate };
  }
  if (reportRange === 'all') return { from: '0000-01-01', to: '9999-12-31' };
  return rangeDates(reportRange);
}

function reportFilteredRecords() {
  const { from, to } = reportEffectiveRange();
  const visibleTypeIds = new Set(reportSelectedTypes);
  return miscRecords.filter(r =>
    r.occurredAt >= from && r.occurredAt <= to && visibleTypeIds.has(r.typeId)
  );
}

async function renderReport() {
  const c = document.getElementById('reportContent');
  // Init defaults
  if (reportSelectedTypes.size === 0) {
    reportSelectedTypes = new Set(activeMiscTypes().map(t => t.id));
  }
  if (!reportTrendTypeId && activeMiscTypes().length > 0) {
    reportTrendTypeId = activeMiscTypes()[0].id;
  }

  const types = miscTypes.filter(t => !t.archived);
  if (types.length === 0) {
    c.innerHTML = `<div class="report-empty">还没有任务集类型。<br>先去"杂项任务集"创建一些类型并录入记录。</div>`;
    return;
  }

  c.innerHTML = `
    <div class="report-toolbar">
      <div class="range-group">
        <button class="range-btn ${reportRange==='today'?'active':''}" onclick="setReportRange('today')">今日</button>
        <button class="range-btn ${reportRange==='week'?'active':''}" onclick="setReportRange('week')">本周</button>
        <button class="range-btn ${reportRange==='month'?'active':''}" onclick="setReportRange('month')">本月</button>
        <button class="range-btn ${reportRange==='30d'?'active':''}" onclick="setReportRange('30d')">近30天</button>
        <button class="range-btn ${reportRange==='all'?'active':''}" onclick="setReportRange('all')">全部</button>
        <button class="range-btn ${reportRange==='custom'?'active':''}" onclick="setReportRange('custom')">自定义</button>
      </div>
      <div id="reportCustomRange" style="display:${reportRange==='custom'?'flex':'none'};gap:6px;align-items:center;">
        <input type="date" id="reportFromInput" value="${reportFromDate||''}" onchange="reportFromDate=this.value; renderReport();">
        <span style="font-size:12px;color:var(--text-muted);">~</span>
        <input type="date" id="reportToInput" value="${reportToDate||''}" onchange="reportToDate=this.value; renderReport();">
      </div>
      <div class="report-type-filter" style="margin-left:auto;">
        ${types.map(t => `
          <label style="background:${hexWithAlpha(t.color,0.15)};">
            <input type="checkbox" ${reportSelectedTypes.has(t.id)?'checked':''} onchange="toggleReportType('${t.id}')">
            ${escHtml(t.icon)} ${escHtml(t.name)}
          </label>
        `).join('')}
      </div>
    </div>

    <div class="report-chart-card">
      <h3>各类型完成数量</h3>
      <div class="report-chart-canvas-wrap"><canvas id="reportBarChart"></canvas></div>
    </div>

    <div class="report-chart-card">
      <h3>各类型占比</h3>
      <div class="report-chart-canvas-wrap"><canvas id="reportPieChart"></canvas></div>
    </div>

    <div class="report-chart-card">
      <h3>
        <span>每日趋势</span>
        <select id="reportTrendType" onchange="reportTrendTypeId=this.value; renderReportCharts();">
          ${types.map(t => `<option value="${t.id}"${reportTrendTypeId===t.id?' selected':''}>${escHtml(t.icon)} ${escHtml(t.name)}</option>`).join('')}
        </select>
      </h3>
      <div class="report-chart-canvas-wrap"><canvas id="reportLineChart"></canvas></div>
    </div>

    <div class="report-chart-card">
      <h3>汇总表</h3>
      <div id="reportSummaryTable"></div>
    </div>

    <div class="report-export-bar">
      <button class="btn btn-ghost btn-sm" onclick="exportReportPNG()">导出 PNG</button>
      <button class="btn btn-ghost btn-sm" onclick="exportReportCSV()">导出 CSV</button>

    </div>
  `;

  const ok = await ensureChartJs();
  if (!ok) return;
  renderReportCharts();
  renderReportSummaryTable();

function setReportRange(r) {
  reportRange = r;
  if (r === 'custom' && !reportFromDate) {
    const d = new Date();
    reportToDate = toDateStr(d);
    d.setDate(d.getDate() - 7);
    reportFromDate = toDateStr(d);
  }
  renderReport();
}

function toggleReportType(id) {
  if (reportSelectedTypes.has(id)) reportSelectedTypes.delete(id);
  else reportSelectedTypes.add(id);
  renderReportCharts();
  renderReportSummaryTable();
}

function destroyReportCharts() {
  for (const k in reportCharts) {
    if (reportCharts[k]) { reportCharts[k].destroy(); reportCharts[k] = null; }
  }
}

function renderReportCharts() {
  if (typeof Chart === 'undefined') return;
  destroyReportCharts();

  const types = miscTypes.filter(t => !t.archived && reportSelectedTypes.has(t.id));
  const records = reportFilteredRecords();
  const { from, to } = reportEffectiveRange();

  // Bar chart
  const barLabels = types.map(t => `${t.icon} ${t.name}`);
  const barData = types.map(t => records.filter(r => r.typeId === t.id).reduce((s, r) => s + r.count, 0));
  const barColors = types.map(t => t.color);

  const barCanvas = document.getElementById('reportBarChart');
  if (barCanvas) {
    reportCharts.bar = new Chart(barCanvas, {
      type: 'bar',
      data: {
        labels: barLabels,
        datasets: [{ label: '完成数量', data: barData, backgroundColor: barColors, borderRadius: 4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
  }

  // Pie chart
  const pieFiltered = types.map((t, i) => ({ t, v: barData[i] })).filter(x => x.v > 0);
  const pieCanvas = document.getElementById('reportPieChart');
  if (pieCanvas) {
    reportCharts.pie = new Chart(pieCanvas, {
      type: 'pie',
      data: {
        labels: pieFiltered.map(x => `${x.t.icon} ${x.t.name}`),
        datasets: [{ data: pieFiltered.map(x => x.v), backgroundColor: pieFiltered.map(x => x.t.color) }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { font: { size: 12 } } },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const total = ctx.dataset.data.reduce((a,b) => a+b, 0);
                const v = ctx.parsed;
                const pct = total > 0 ? ((v / total) * 100).toFixed(1) : 0;
                return `${ctx.label}: ${v} (${pct}%)`;
              }
            }
          }
        }
      }
    });
  }

  // Line chart (trend for selected type)
  const trendType = miscTypes.find(t => t.id === reportTrendTypeId);
  const lineCanvas = document.getElementById('reportLineChart');
  if (lineCanvas && trendType) {
    const days = enumerateDays(from, to);
    const dailyMap = {};
    for (const r of miscRecords) {
      if (r.typeId !== trendType.id) continue;
      if (r.occurredAt < from || r.occurredAt > to) continue;
      dailyMap[r.occurredAt] = (dailyMap[r.occurredAt] || 0) + r.count;
    }
    reportCharts.line = new Chart(lineCanvas, {
      type: 'line',
      data: {
        labels: days.map(d => formatDateShort(d)),
        datasets: [{
          label: `${trendType.icon} ${trendType.name}`,
          data: days.map(d => dailyMap[d] || 0),
          borderColor: trendType.color,
          backgroundColor: hexWithAlpha(trendType.color, 0.15),
          fill: true, tension: 0.3, pointRadius: 3
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
  }
}

function enumerateDays(fromStr, toStr) {
  const out = [];
  if (!fromStr || !toStr || fromStr === '0000-01-01') {
    // For 'all' range, derive from records
    if (miscRecords.length === 0) return [toDateStr(new Date())];
    const sorted = [...miscRecords].sort((a,b) => a.occurredAt.localeCompare(b.occurredAt));
    fromStr = sorted[0].occurredAt;
    toStr = toDateStr(new Date());
  }
  const cur = new Date(fromStr);
  const end = new Date(toStr);
  // Cap at 90 days to avoid huge x axis
  let count = 0;
  while (cur <= end && count < 90) {
    out.push(toDateStr(cur));
    cur.setDate(cur.getDate() + 1);
    count++;
  }
  return out;
}

function renderReportSummaryTable() {
  const wrap = document.getElementById('reportSummaryTable');
  if (!wrap) return;
  const types = miscTypes.filter(t => !t.archived && reportSelectedTypes.has(t.id));
  const records = reportFilteredRecords();
  const totals = types.map(t => ({
    t,
    total: records.filter(r => r.typeId === t.id).reduce((s, r) => s + r.count, 0),
    count: records.filter(r => r.typeId === t.id).length
  }));
  const grand = totals.reduce((s, x) => s + x.total, 0);

  let html = '<table class="report-summary-table"><thead><tr><th>类型</th><th class="num">总数量</th><th class="num">记录条数</th><th class="num">占比</th></tr></thead><tbody>';
  for (const x of totals) {
    const pct = grand > 0 ? ((x.total / grand) * 100).toFixed(1) : 0;
    html += `<tr>
      <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${x.t.color};margin-right:6px;"></span>${escHtml(x.t.icon)} ${escHtml(x.t.name)}</td>
      <td class="num">${x.total} ${escHtml(x.t.unit)}</td>
      <td class="num">${x.count}</td>
      <td class="num">${pct}%</td>
    </tr>`;
  }
  html += `<tr style="font-weight:600;"><td>合计</td><td class="num">${grand}</td><td class="num">${records.length}</td><td class="num">100%</td></tr>`;
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function exportReportPNG() {
  const charts = [
    { name: '柱状图', chart: reportCharts.bar },
    { name: '饼图', chart: reportCharts.pie },
    { name: '趋势图', chart: reportCharts.line }
  ];
  for (const { name, chart } of charts) {
    if (!chart) continue;
    const url = chart.toBase64Image('image/png', 1);
    const a = document.createElement('a');
    a.href = url;
    a.download = `工作汇报-${name}-${toDateStr(new Date())}.png`;
    a.click();
  }
  showToast('PNG 已导出');
}

function exportReportCSV() {
  const { from, to } = reportEffectiveRange();
  const records = reportFilteredRecords();
  const lines = [];
  lines.push(`# 工作汇报明细 (${from} ~ ${to})`);
  lines.push('日期,类型,数量,单位,备注');
  for (const r of records) {
    const t = miscTypes.find(x => x.id === r.typeId);
    if (!t) continue;
    const note = (r.note || '').replace(/"/g, '""').replace(/\n/g, ' ');
    lines.push(`${r.occurredAt},${t.name},${r.count},${t.unit},"${note}"`);
  }
  lines.push('');
  lines.push('# 汇总');
  lines.push('类型,总数量,单位,记录条数');
  const types = miscTypes.filter(t => !t.archived && reportSelectedTypes.has(t.id));
  for (const t of types) {
    const total = records.filter(r => r.typeId === t.id).reduce((s, r) => s + r.count, 0);
    const cnt = records.filter(r => r.typeId === t.id).length;
    lines.push(`${t.name},${total},${t.unit},${cnt}`);
  }
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `工作汇报-${toDateStr(new Date())}.csv`;
  a.click();
  showToast('CSV 已导出');
}

async function exportReportPPT() {
  if (typeof PptxGenJS === 'undefined') { showToast('PPT 库未加载'); return; }
  const { from, to } = reportEffectiveRange();
  const types = miscTypes.filter(t => !t.archived && reportSelectedTypes.has(t.id));
  const records = reportFilteredRecords();

  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE';

  // Cover
  let slide = pptx.addSlide();
  slide.background = { color: 'FDF9F1' };
  slide.addText('工作汇报', { x: 0.5, y: 2.5, w: 12, h: 1, fontSize: 44, bold: true, color: '2D2417', align: 'center' });
  slide.addText(`${from}  ~  ${to}`, { x: 0.5, y: 3.7, w: 12, h: 0.6, fontSize: 18, color: '6B5A3F', align: 'center' });
  slide.addText(`总记录 ${records.length} 条 · ${types.length} 个任务集类型`, { x: 0.5, y: 4.4, w: 12, h: 0.5, fontSize: 14, color: '6B5A3F', align: 'center' });

  // Chart slides
  const chartSlides = [
    { title: '各类型完成数量', chart: reportCharts.bar },
    { title: '各类型占比', chart: reportCharts.pie },
    { title: '每日趋势', chart: reportCharts.line }
  ];
  for (const cs of chartSlides) {
    if (!cs.chart) continue;
    slide = pptx.addSlide();
    slide.background = { color: 'FDF9F1' };
    slide.addText(cs.title, { x: 0.5, y: 0.3, w: 12, h: 0.6, fontSize: 24, bold: true, color: '2D2417' });
    slide.addImage({ data: cs.chart.toBase64Image('image/png', 1), x: 1, y: 1.2, w: 11, h: 5.5 });
  }

  // Summary table slide
  slide = pptx.addSlide();
  slide.background = { color: 'FDF9F1' };
  slide.addText('汇总表', { x: 0.5, y: 0.3, w: 12, h: 0.6, fontSize: 24, bold: true, color: '2D2417' });
  const rows = [[
    { text: '类型', options: { bold: true, fill: 'F4E4C3' } },
    { text: '总数量', options: { bold: true, fill: 'F4E4C3' } },
    { text: '单位', options: { bold: true, fill: 'F4E4C3' } },
    { text: '记录条数', options: { bold: true, fill: 'F4E4C3' } }
  ]];
  for (const t of types) {
    const total = records.filter(r => r.typeId === t.id).reduce((s, r) => s + r.count, 0);
    const cnt = records.filter(r => r.typeId === t.id).length;
    rows.push([`${t.icon} ${t.name}`, String(total), t.unit, String(cnt)]);
  }
  slide.addTable(rows, { x: 1, y: 1.2, w: 11, fontSize: 13, color: '2D2417', border: { type: 'solid', pt: 0.5, color: 'EDE4CF' } });

  await pptx.writeFile({ fileName: `工作汇报-${toDateStr(new Date())}.pptx` });
  showToast('PPT 已导出');
}

let aiDisplay = [];    // UI 渲染用
let aiBusy = false;

// ---- 文档生成：规范化/校验（纯函数，可在 console 测） ----
function validateDocSpec(type, spec){
  const errs = [];
  if(!spec || typeof spec !== 'object') return { ok:false, errors:['spec 不是对象'] };
  if(type === 'pptx'){ if(!Array.isArray(spec.slides) || !spec.slides.length) errs.push('slides 为空'); }
  else if(type === 'xlsx'){ if(!Array.isArray(spec.sheets) || !spec.sheets.length) errs.push('sheets 为空'); }
  else if(type === 'docx'){ if(!spec.title && !(Array.isArray(spec.blocks) && spec.blocks.length)) errs.push('缺少 title 或 blocks'); }
  else errs.push('未知文档类型 '+type);
  return { ok: errs.length === 0, errors: errs };
}

async function docGenPptx(spec){
  const pptx = new PptxGenJS();
  pptx.defineLayout({ name:'W16', width:13.333, height:7.5 });
  pptx.layout = 'W16';
  const ACCENT='4F46E5', DARK='1F2937', MUTED='6B7280', BG='F8F8FC';
  (spec.slides||[]).forEach(s=>{
    const slide = pptx.addSlide();
    if(s.layout === 'title'){
      slide.background = { color:BG };
      slide.addShape(pptx.ShapeType.rect, { x:0.8, y:2.45, w:2, h:0.08, fill:{color:ACCENT} });
      slide.addText(s.title||'', { x:0.8, y:2.6, w:11.7, h:1.5, fontSize:40, bold:true, color:DARK });
      if(s.note) slide.addText(s.note, { x:0.8, y:4.1, w:11.7, h:0.8, fontSize:18, color:MUTED });
    } else if(s.layout === 'section'){
      slide.background = { color:ACCENT };
      slide.addText(s.title||'', { x:0.8, y:3, w:11.7, h:1.5, fontSize:34, bold:true, color:'FFFFFF' });
    } else {
      slide.addText(s.title||'', { x:0.6, y:0.4, w:12.1, h:0.9, fontSize:26, bold:true, color:DARK });
      slide.addShape(pptx.ShapeType.line, { x:0.6, y:1.3, w:12.1, h:0, line:{color:ACCENT, width:2} });
      const bullets = (s.bullets||[]).map(t=>({ text:String(t), options:{ bullet:true, fontSize:18, color:DARK, paraSpaceAfter:10 } }));
      if(bullets.length) slide.addText(bullets, { x:0.8, y:1.6, w:11.7, h:5.2, valign:'top' });
      if(s.note) slide.addNotes(String(s.note));

async function docGenXlsx(spec){
  const wb = new ExcelJS.Workbook();
  (spec.sheets||[]).forEach(s=>{
    const ws = wb.addWorksheet(s.name || 'Sheet1');
    const headers = s.headers || [];
    if(headers.length){
      const hr = ws.addRow(headers);
      hr.font = { bold:true, color:{argb:'FFFFFFFF'} };
      hr.alignment = { vertical:'middle' };
      hr.eachCell(c=>{
        c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF4F46E5'} };
        c.border = { bottom:{ style:'thin', color:{argb:'FFCCCCCC'} } };
      });
    }
    (s.rows||[]).forEach(r=>ws.addRow(r));
    headers.forEach((h,i)=>{
      let max = String(h==null?'':h).length;
      (s.rows||[]).forEach(r=>{ const v = r[i]==null?'':String(r[i]); if(v.length>max) max=v.length; });
      ws.getColumn(i+1).width = Math.min(Math.max(max+2, 8), 48);
    });
    if(headers.length) ws.views = [{ state:'frozen', ySplit:1 }];
  });
  const buf = await wb.xlsx.writeBuffer();
  saveAs(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), (spec.filename||'export')+'.xlsx');
}

async function docGenDocx(spec){
  const D = docx;
  const children = [];
  if(spec.title) children.push(new D.Paragraph({ text:String(spec.title), heading:D.HeadingLevel.TITLE }));
  (spec.blocks||[]).forEach(b=>{
    if(b.type === 'heading'){
      children.push(new D.Paragraph({ text:String(b.text||''), heading: b.level===2 ? D.HeadingLevel.HEADING_2 : D.HeadingLevel.HEADING_1 }));
    } else if(b.type === 'paragraph'){
      children.push(new D.Paragraph({ children:[ new D.TextRun(String(b.text||'')) ] }));
    } else if(b.type === 'list'){
      (b.items||[]).forEach(it=> children.push(new D.Paragraph({ text:String(it), bullet:{ level:0 } })));
    } else if(b.type === 'table'){
      const rows = (b.rows||[]).map(r => new D.TableRow({ children: r.map(c => new D.TableCell({ children:[ new D.Paragraph(String(c==null?'':c)) ] })) }));
      if(rows.length) children.push(new D.Table({ rows }));
    }
  });
  const doc = new D.Document({ sections:[{ children }] });
  const blob = await D.Packer.toBlob(doc);
  saveAs(blob, (spec.filename||'document')+'.docx');
}

// ---- Excel 分析：解析与查询（纯函数，可在 console 测） ----
function parseDelimited(text){
  text = String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  if(!text) return { headers:[], rows:[] };
  const lines = text.split('\n').filter(l=>l.length);
  if(!lines.length) return { headers:[], rows:[] };
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const split = l => l.split(delim).map(c=>c.trim());
  return { headers: split(lines[0]), rows: lines.slice(1).map(split) };
}

function runExcelQuery(sheet, q){
  q = q || {};
  let rows = (sheet.rows||[]).map(r=>{ const o={}; (sheet.headers||[]).forEach((h,i)=>o[h]=r[i]); return o; });
  (q.filters||[]).forEach(f=>{
    rows = rows.filter(row=>{
      const v = row[f.col], nv = parseFloat(v), nf = parseFloat(f.value);
      switch(f.op){
        case '=':  return String(v)===String(f.value);
        case '!=': return String(v)!==String(f.value);
        case '>':  return nv >  nf;
        case '>=': return nv >= nf;
        case '<':  return nv <  nf;
        case '<=': return nv <= nf;
        case 'contains': return String(v).includes(String(f.value));
        default: return true;
      }
    });
  });
  let result;
  if(q.groupBy){
    const groups = {};
    rows.forEach(row=>{ const k = row[q.groupBy]; (groups[k] = groups[k] || []).push(row); });
    result = Object.entries(groups).map(([k,grp])=>{
      const o = { [q.groupBy]: k };
      (q.aggregations||[]).forEach(a=>{
        const nums = grp.map(r=>parseFloat(r[a.col])).filter(n=>!isNaN(n));
        let val = 0;
        switch(a.fn){
          case 'sum':   val = nums.reduce((x,y)=>x+y,0); break;
          case 'avg':   val = nums.length ? nums.reduce((x,y)=>x+y,0)/nums.length : 0; break;
          case 'count': val = grp.length; break;
          case 'max':   val = nums.length ? Math.max(...nums) : 0; break;
          case 'min':   val = nums.length ? Math.min(...nums) : 0; break;
        }
        o[a.fn+'_'+a.col] = val;
      });
      return o;
    });
  } else {
    result = rows;
  }
  if(q.sortBy){
    result.sort((a,b)=>{
      const x=a[q.sortBy], y=b[q.sortBy], nx=parseFloat(x), ny=parseFloat(y);
      const cmp = (!isNaN(nx)&&!isNaN(ny)) ? (nx-ny) : String(x).localeCompare(String(y));
      return (q.desc ? -1 : 1) * cmp;
    });
  }
  if(q.limit) result = result.slice(0, q.limit);
  return result;
}

async function parseXlsxFile(file){
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());
  const sheets = [];
  wb.eachSheet(ws=>{
    let headers = []; const rows = [];
    ws.eachRow({ includeEmpty:false }, (row, rn)=>{
      const vals = [];
      row.eachCell({ includeEmpty:true }, c=>{
        let v = c.value;
        if(v && typeof v === 'object') v = (v.text!=null?v.text : (v.result!=null?v.result : JSON.stringify(v)));
        vals.push(v==null ? '' : v);
      });
      if(rn === 1) headers = vals.map(String); else rows.push(vals);
    });
    sheets.push({ name: ws.name, headers, rows });
  });
  return sheets;
}

async function aiLoadFile(file){
  try{
    let sheets;
    if(/\.csv$/i.test(file.name)){
      const txt = await file.text();
      const p = parseDelimited(txt);
      sheets = [{ name: file.name.replace(/\.csv$/i,''), headers:p.headers, rows:p.rows }];
    } else {
      if(typeof ExcelJS === 'undefined'){ showToast('Excel 库未加载'); return; }
      sheets = await parseXlsxFile(file);
    }
    loadedSheets = sheets;
    const summary = sheets.map(s=>`${s.name}(${s.headers.length}列 ${s.rows.length}行)`).join('、');
    aiDisplay.push({ role:'tool', text:'📎 已加载：'+summary });
    aiMessages.push({ role:'user', content:'[系统] 我已上传表格，可用 inspect_excel/query_excel 分析。已加载：'+summary });
    renderAI();
  }catch(e){ showToast('解析失败：'+(e.message||e)); }
}

function evalRowExpr(expr, row){
  if(!/^[\w\s+\-*/().,]+$/.test(String(expr))) throw new Error('表达式含非法字符');
  const keys = Object.keys(row);
  const vals = keys.map(k=>{ const n = parseFloat(row[k]); return isNaN(n) ? 0 : n; });
  const fn = new Function(...keys, 'return ('+expr+');');
  return fn(...vals);
}

let _pyodide = null, _pyLoading = null;

// 动态插入 <script> 并在 onload 时 resolve
function loadScript(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('脚本加载失败：'+url));
    document.head.appendChild(s);
  });
}

// 单例懒加载 Pyodide（防并发重复加载）
function ensurePyodide(onProgress){
  if(_pyodide) return Promise.resolve(_pyodide);
  if(_pyLoading) return _pyLoading;
  _pyLoading = (async ()=>{
    onProgress && onProgress('下载 Python 运行时…');
    await loadScript('https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js');
    const py = await loadPyodide({ indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
    onProgress && onProgress('加载 pandas…（首次约 35MB，请稍候）');
    await py.loadPackage(['pandas','numpy','lxml']); // 注：openpyxl 不在 Pyodide 0.26.2 发行版，去掉以免加载失败
    _pyodide = py;
    return py;
  })();
  _pyLoading.catch(()=>{ _pyLoading = null; }); // 失败后允许重试
  return _pyLoading;
}

// 注入 loadedSheets → 执行 AI 代码 → 收 stdout 与 /output 文件 → 下载
async function runUserPython(code){
  const py = _pyodide;            // 调用方保证已启用
  py.globals.set('__sheets_json', JSON.stringify(loadedSheets));
  py.globals.set('__user_code', code);
  const setup = `
import json, os, io, contextlib, pandas as pd
os.makedirs('/output', exist_ok=True)
for __f in os.listdir('/output'):
    os.remove('/output/'+__f)
_sheets = json.loads(__sheets_json)
sheets = [pd.DataFrame(s['rows'], columns=s['headers']) for s in _sheets]
df = sheets[0] if sheets else pd.DataFrame()
__buf = io.StringIO()
with contextlib.redirect_stdout(__buf):
    exec(__user_code, globals())
__stdout = __buf.getvalue()
`;
  await py.runPythonAsync(setup);
  const stdout = py.globals.get('__stdout');
  const files = py.FS.readdir('/output').filter(f => f !== '.' && f !== '..');
  for(const f of files){
    const data = py.FS.readFile('/output/'+f);
    saveAs(new Blob([data]), f);
  }
  return { stdout: String(stdout||''), files };
}

- 用户上传/粘贴表格后：先 inspect_excel 看结构，再 query_excel 做筛选/分组聚合/排序得到结果并解读；需要落地文件时 export_processed_xlsx 导出（会弹确认卡）。绝不臆造数据。
- 复杂/任意分析，或需要透视、多表关联、复杂计算时，可用 run_python（浏览器内置 pandas，已注入 df 和 sheets）。简单的筛选/汇总仍优先用 query_excel（快、免加载）。run_python 仅在用户启用高级分析后可用；若返回未启用提示，请转告用户点对话框里的「⚡ 启用高级分析」按钮。要生成下载文件就写到 /output/，用 CSV（to_csv）；run_python 不支持生成 .xlsx，要 Excel 文件请改用 generate_xlsx/export_processed_xlsx。用了 run_python 后，回复里简述「我运行了这段代码…」并解读结果。
- 回复用中文，简洁明了。`;
}

function buildPolishMessages(original, rules){
  const sys = '你是公司指导书润色助手。请严格依据下面的「规则/审查反馈」改写用户给出的原文：\n'
    + '- 只输出改写后的成稿，不要任何解释、前言或额外说明。\n'
    + '- 保持原文的事实与技术含义，只在表达、结构、合规性上按规则优化。\n'
    + '- 规则没要求改的地方尽量保留原貌。\n\n'
    + '规则/审查反馈：\n' + rules;
  return [{ role:'system', content:sys }, { role:'user', content:original }];
}

async function callPolishAI(original, rules){
  const res = await fetch(AI_ENDPOINT, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY },
    body: JSON.stringify({ model:AI_MODEL, messages:buildPolishMessages(original, rules) })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  if (!data.choices || !data.choices[0]) throw new Error('返回异常：' + JSON.stringify(data).slice(0,200));
  return data.choices[0].message.content || '';
}

async function executeAITool(name, args) {
  try {
    switch (name) {
      case 'list_tasks': {
        let list = todos.slice();
        if (args.status && args.status !== 'all') list = list.filter(t => t.status === args.status);
        if (args.tag) list = list.filter(t => (t.tags||[]).includes(args.tag));
        if (args.search) { const q = args.search.toLowerCase(); list = list.filter(t => t.title.toLowerCase().includes(q)); }
        const mapped = list.slice(0, 80).map(t => ({ id:t.id, title:t.title, status:t.status, priority:t.priority, startDate:t.startDate, dueDate:t.dueDate, tags:t.tags, parentId:t.parentId }));
        return { ok:true, count:mapped.length, tasks:mapped };
      }
      case 'create_task': {
        if (!args.title) return { ok:false, message:'缺少标题' };
        let parentId = null;
        if (args.parentTitle) { const p = todos.find(t => t.title.toLowerCase().includes(args.parentTitle.toLowerCase())); if (p) parentId = p.id; }
        const t = await addTask(args.title, parentId, { priority:args.priority||null, tags:args.tags||[], startDate:args.startDate||null, dueDate:args.dueDate||null });
        return { ok:true, id:t.id, title:t.title };
      }
      case 'update_task': {
        const t = getTask(args.id); if (!t) return { ok:false, message:'找不到任务 id='+args.id };
        const changes = {};
        ['title','status','priority','startDate','dueDate'].forEach(k => { if (k in args) changes[k] = args[k]; });
        await updateTask(args.id, changes);
        return { ok:true, id:args.id };
      }
      case 'complete_task': {
        const t = getTask(args.id); if (!t) return { ok:false, message:'找不到任务 id='+args.id };
        await updateTask(args.id, { status:'completed' });
        return { ok:true, id:args.id };
      }
      case 'delete_task': {
        const t = getTask(args.id); if (!t) return { ok:false, message:'找不到任务 id='+args.id };
        await deleteTask(args.id);
        return { ok:true, id:args.id };
      }
      case 'get_misc_types': {
        return { ok:true, types: activeMiscTypes().map(t => ({ id:t.id, name:t.name, unit:t.unit, icon:t.icon })) };
      }
      case 'query_misc_records': {
        let from, to;
        if (args.from || args.to) { from = args.from || '0000-01-01'; to = args.to || '9999-12-31'; }
        else { const r = rangeDates('30d'); from = r.from; to = r.to; }
        let recs = miscRecords.filter(r => r.occurredAt >= from && r.occurredAt <= to);
        if (args.typeName) { const ty = miscTypes.find(t => t.name.toLowerCase().includes(args.typeName.toLowerCase())); if (ty) recs = recs.filter(r => r.typeId === ty.id); }
        const agg = {};
        for (const r of recs) agg[r.typeId] = (agg[r.typeId]||0) + r.count;
        const summary = Object.entries(agg).map(([tid,total]) => { const ty = miscTypes.find(t => t.id === tid); return { type: ty?ty.name:'(已删除)', total, unit: ty?ty.unit:'' }; });
        return { ok:true, from, to, recordCount:recs.length, summary };
      }
      case 'add_misc_record': {
        if (!args.typeName) return { ok:false, message:'缺少类型名' };
        const ty = miscTypes.find(t => t.name.toLowerCase().includes(args.typeName.toLowerCase()));
        if (!ty) return { ok:false, message:'找不到类型「'+args.typeName+'」，现有：'+activeMiscTypes().map(t=>t.name).join('、') };
        const r = await addMiscRecord({ typeId:ty.id, count:args.count||1, occurredAt:args.date||toDateStr(new Date()), note:args.note||'' });
        if (!r) return { ok:false, message:'保存失败' };
        return { ok:true, type:ty.name, count:r.count, date:r.occurredAt };
      }
      case 'generate_pptx': {
        const v = validateDocSpec('pptx', args); if(!v.ok) return { ok:false, message:v.errors.join('；') };
        if(typeof PptxGenJS==='undefined') return { ok:false, message:'PPT 库未加载' };
        await docGenPptx(args);
        return { ok:true, message:'已生成并下载 PPT（'+(args.slides?args.slides.length:0)+' 页）' };
      }
      case 'generate_xlsx': {
        const v = validateDocSpec('xlsx', args); if(!v.ok) return { ok:false, message:v.errors.join('；') };
        if(typeof ExcelJS==='undefined') return { ok:false, message:'Excel 库未加载' };
        await docGenXlsx(args);
        return { ok:true, message:'已生成并下载 Excel（'+(args.sheets?args.sheets.length:0)+' 个表）' };
      }
      case 'generate_docx': {
        const v = validateDocSpec('docx', args); if(!v.ok) return { ok:false, message:v.errors.join('；') };
        if(typeof docx==='undefined' || typeof saveAs==='undefined') return { ok:false, message:'Word 库未加载' };
        await docGenDocx(args);
        return { ok:true, message:'已生成并下载 Word' };
      }
      case 'inspect_excel': {
        if(!loadedSheets.length) return { ok:false, message:'还没有已加载的表格，请用户先上传或粘贴' };
        const n = args.sampleRows || 5;
        return { ok:true, sheets: loadedSheets.map((s,i)=>({ index:i, name:s.name, columns:s.headers, rowCount:s.rows.length, sample:s.rows.slice(0,n) })) };
      }
      case 'query_excel': {
        if(!loadedSheets.length) return { ok:false, message:'还没有已加载的表格' };
        const sheet = loadedSheets[args.sheetIndex || 0];
        if(!sheet) return { ok:false, message:'sheetIndex 越界' };
        const rows = runExcelQuery(sheet, args);
        return { ok:true, count:rows.length, rows: rows.slice(0, 200) };
      }
      case 'export_processed_xlsx': {
        if(!loadedSheets.length) return { ok:false, message:'还没有已加载的表格' };
        const sheet = loadedSheets[args.sheetIndex || 0];
        if(!sheet) return { ok:false, message:'sheetIndex 越界' };
        const rows = runExcelQuery(sheet, args);
        const headers = rows.length ? Object.keys(rows[0]) : sheet.headers;
        const matrix = rows.map(r=>headers.map(h=>r[h]));
        await docGenXlsx({ filename: args.filename || '处理结果', sheets:[{ name:'结果', headers, rows:matrix }] });
        return { ok:true, message:'已导出 '+rows.length+' 行到 Excel' };
      }
      case 'add_computed_column': {
        if(!loadedSheets.length) return { ok:false, message:'还没有已加载的表格' };
        const sheet = loadedSheets[args.sheetIndex || 0];
        if(!sheet) return { ok:false, message:'sheetIndex 越界' };
        try {
          sheet.rows = sheet.rows.map(r=>{
            const obj = {}; sheet.headers.forEach((h,i)=>obj[h]=r[i]);
            return [...r, evalRowExpr(args.expr, obj)];
          });
          sheet.headers = [...sheet.headers, args.newColumn];
          return { ok:true, message:'已新增列「'+args.newColumn+'」', columns:sheet.headers };
        } catch(e){ return { ok:false, message:'计算失败：'+(e.message||e) }; }
      }
      case 'generate_chart': {
        if(typeof Chart==='undefined') return { ok:false, message:'图表库未加载' };
        await docGenChart(args);
        return { ok:true, message:'已生成图表 PNG' };
      }
      case 'run_python': {
        if(!_pyodide) return { ok:false, message:'高级分析未启用。请用户点对话框里的「⚡ 启用高级分析」按钮（首次约下载 35MB）。' };
        try {
          const out = await runUserPython(args.code || '');
          return { ok:true, stdout: out.stdout.slice(0, 4000), files: out.files, ranCode: args.code };
        } catch(e){ return { ok:false, message:'Python 执行出错：'+String(e && e.message || e) }; }
      }
    }
    return { ok:false, message:'未知工具 '+name };
  } catch (e) {
    return { ok:false, message:String(e && e.message || e) };
  }
}

      if ('priority' in args) parts.push('优先级→' + (args.priority?('P'+args.priority):'无'));

      if ('startDate' in args) parts.push('开始→' + (args.startDate||'清空'));
      return '修改' + (t?'「'+t.title+'」':'任务 #'+args.id) + '：' + (parts.join('，') || '（无改动）');
    }

      const t = getTask(args.id);

    }
    case 'delete_task': {

function pushAIToolResults(calls, results) {
  for (let i = 0; i < calls.length; i++) {
    aiMessages.push({ role:'tool', tool_call_id: calls[i].id, content: JSON.stringify(results[i] != null ? results[i] : { ok:false }) });
  }
}

async function aiRunTurn() {
  aiBusy = true; renderAI();
  let assistant;
  try {
    assistant = await callAI([{ role:'system', content: buildAISystem() }, ...aiMessages]);
  } catch (e) {
    aiBusy = false;
    aiDisplay.push({ role:'assistant', text:'⚠ 出错了：' + (e.message||e) });
    renderAI();
    return;
  }
  aiMessages.push(assistant);
  const calls = assistant.tool_calls || [];
  if (calls.length === 0) {
    aiBusy = false;
    if (assistant.content) aiDisplay.push({ role:'assistant', text: assistant.content });
    renderAI();
    return;
  }
  if (assistant.content) aiDisplay.push({ role:'assistant', text: assistant.content });
  const results = new Array(calls.length).fill(null);
  const pendingWrites = [];
  for (let i = 0; i < calls.length; i++) {
    const call = calls[i];
    let args = {};
    try { args = JSON.parse(call.function.arguments || '{}'); } catch (e) {}
    if (isWriteTool(call.function.name) || isDocTool(call.function.name)) {
      pendingWrites.push(i);
      aiDisplay.push({ role:'confirm', confirmId: call.id, name: call.function.name, args, status:'pending' });
    } else {
      aiDisplay.push({ role:'tool', text: aiToolActivity(call.function.name) });
      results[i] = await executeAITool(call.function.name, args);
    }
  }
  if (pendingWrites.length === 0) {
    pushAIToolResults(calls, results);
    aiRunTurn();
    return;
  }
  aiPending = { calls, results, remaining: pendingWrites.length };
  aiBusy = false;
  renderAI();
}

async function aiConfirm(confirmId, ok) {
  if (!aiPending) return;
  const idx = aiPending.calls.findIndex(c => c.id === confirmId);
  if (idx < 0) return;
  const disp = aiDisplay.find(d => d.role === 'confirm' && d.confirmId === confirmId);
  if (disp && disp.status !== 'pending') return;
  const call = aiPending.calls[idx];
  let args = {};
  try { args = JSON.parse(call.function.arguments || '{}'); } catch (e) {}
  if (ok) {
    const out = await executeAITool(call.function.name, args);
    aiPending.results[idx] = out;
    if (disp) disp.status = out && out.ok === false ? 'cancelled' : 'done';
  } else {
    aiPending.results[idx] = { ok:false, cancelled:true, message:'用户取消了该操作' };
    if (disp) disp.status = 'cancelled';
  }
  aiPending.remaining--;
  renderAI();
  if (aiPending.remaining <= 0) {
    const { calls, results } = aiPending;
    aiPending = null;
    pushAIToolResults(calls, results);
    aiRunTurn();
  }
}
window.aiConfirm = aiConfirm;

function renderConfirmCard(d) {
  const desc = aiConfirmText(d.name, d.args);
  let foot;
  if (d.status === 'pending') {
    foot = `<div class="ai-confirm-actions">
      <button class="btn btn-primary btn-sm" onclick="aiConfirm('${d.confirmId}', true)">确认</button>
      <button class="btn btn-ghost btn-sm" onclick="aiConfirm('${d.confirmId}', false)">取消</button>
    </div>`;
  } else if (d.status === 'done') {
    foot = `<div class="ai-confirm-status done">✓ 已执行</div>`;
  } else {
    foot = `<div class="ai-confirm-status cancelled">已取消</div>`;
  }
  return `<div class="ai-confirm-card ${d.status}">
    <div class="ai-confirm-title">⚠ AI 想执行操作</div>
    <div class="ai-confirm-desc">${escHtml(desc)}</div>
    ${foot}
  </div>`;
}

function renderAI() {
  const box = document.getElementById('aiMessages');
  if (!box) return;
  let html = '';
  if (aiDisplay.length === 0 && !aiBusy) {
    html += `<div class="ai-empty">问我点什么吧，比如：<br>"这个月不合格品处理了多少？"<br>"新建一个 P1 任务：写月度报告，周五截止"<br>"给设备点检记 3 次"</div>`;
  }
  for (const d of aiDisplay) {
    if (d.role === 'user') html += `<div class="ai-msg user"><div class="ai-bubble">${escHtml(d.text)}</div></div>`;
    else if (d.role === 'assistant') html += `<div class="ai-msg assistant"><div class="ai-bubble">${escHtml(d.text)}</div></div>`;
    else if (d.role === 'tool') html += `<div class="ai-tool-line">${escHtml(d.text)}</div>`;
    else if (d.role === 'confirm') html += renderConfirmCard(d);
  }
  if (aiBusy) html += `<div class="ai-msg assistant"><div class="ai-bubble ai-typing">思考中<span>.</span><span>.</span><span>.</span></div></div>`;
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function updateNavBadges() {
  document.getElementById('navCountTotal').textContent = getRootTasks().length;
  const todayStr = toDateStr(today);
  const activeToday = todos.filter(t => {
    if (t.status !== 'in-progress') return false;
    if (t.startDate && t.startDate > todayStr) return false;
    if (t.dueDate && t.dueDate < todayStr) return false;
    return true;
  }).length;
  document.getElementById('navCountDaily').textContent = activeToday;
  const miscBadge = document.getElementById('navCountMisc');
  if (miscBadge) {
    const todayMisc = miscRecords.filter(r => r.occurredAt === todayStr).reduce((s, r) => s + r.count, 0);
    miscBadge.textContent = todayMisc;
  }
}

function toDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function formatDateShort(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  return `${parseInt(parts[1])}月${parseInt(parts[2])}日`;
}
function statusLabel(status) {
  const map = { 'not-started': '未开始', 'in-progress': '进行中', 'completed': '已完成' };
  return map[status] || status;
}
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// PLATFORM DETECTION & TOAST
// ============================================================
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform);
const MOD_KEY = IS_MAC ? 'metaKey' : 'ctrlKey';
const MOD_LABEL = IS_MAC ? '⌘' : 'Ctrl';
const DEL_LABEL = IS_MAC ? '⌘⌫' : 'Ctrl+Del';

function showToast(msg, duration = 3000) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._tid);
  toast._tid = setTimeout(() => toast.classList.remove('show'), duration);
}

// ============================================================
// COMMAND PALETTE
// ============================================================
const cmdK = {
  _idx: -1,
  _items: [],
  open() {
    const overlay = document.getElementById('cmdkOverlay');
    const input = document.getElementById('cmdkInput');
    overlay.classList.add('show');
    input.value = '';
    this._idx = -1;
    this._populate('');
    setTimeout(() => input.focus(), 50);
  },
  close() {
    document.getElementById('cmdkOverlay').classList.remove('show');
    this._items = [];
    this._idx = -1;
  },
  _populate(query) {
    const list = document.getElementById('cmdkList');
    const q = query.toLowerCase().trim();
    const items = [];
    let html = '<div class="cmdk-group-label">跳转视图</div>';
    for (const v of [
      { name: '今日', view: 'daily', icon: '☀' },
      { name: '总任务列表', view: 'list', icon: '☰' },
      { name: '日历表', view: 'calendar', icon: '◷' },
      { name: '甘特图', view: 'gantt', icon: '▦' },
      { name: '杂项任务集', view: 'misc', icon: '☑' },
      { name: '工作汇报', view: 'report', icon: '📊' },
    ]) {
      if (!q || v.name.includes(q)) {
        items.push({ label: v.name, hint: '跳转', action: () => { switchView(v.view); this.close(); }, icon: v.icon });
      }
    }
    html += '<div class="cmdk-group-label">操作</div>';
    const actions = [
      { label: '新建任务', hint: MOD_LABEL + '+N', action: () => { this.close(); openQuickAdd(); }, icon: '+' },
      { label: '科比助理', hint: 'AI', action: () => { this.close(); openAIPopup(); }, icon: '🏀' },
      { label: '清空已完成任务', hint: '', action: () => { this.close(); cleanCompleted(); }, icon: '🧹' },
      { label: '导出 PPT 报告', hint: '', action: () => { this.close(); generatePPT(); }, icon: '📊' },
    ];
    for (const a of actions) {
      if (!q || a.label.includes(q)) items.push({ ...a, icon: a.icon });
    }
    if (q) {
      html += '<div class="cmdk-group-label">搜索任务</div>';
      const matches = todos.filter(t => t.title.toLowerCase().includes(q));
      if (matches.length === 0) {
        html += '<div class="cmdk-item"><span style="color:var(--text-muted);">无匹配任务</span></div>';
      }
      for (const t of matches.slice(0, 8)) {
        items.push({ label: t.title, hint: statusLabel(t.status), action: () => { this.close(); openDetail(t.id); }, icon: '●' });
      }
    }
    this._items = items;
    for (let i = 0; i < items.length; i++) {
      html += `<div class="cmdk-item" data-cmdk-idx="${i}" onmousedown="event.preventDefault();cmdK._pick(${i})">
        <span class="cmdk-icon">${items[i].icon}</span>
        <span class="cmdk-label">${escHtml(items[i].label)}</span>
        <span class="cmdk-hint">${items[i].hint || ''}</span>
      </div>`;
    }
    list.innerHTML = html;
    this._updateActive();
  },
  _pick(i) {
    if (i >= 0 && i < this._items.length) {
      this._items[i].action();
    }
  },
  _updateActive() {
    const list = document.getElementById('cmdkList');
    list.querySelectorAll('.cmdk-item').forEach(el => el.classList.remove('active'));
    if (this._idx >= 0) {
      const el = list.querySelector(`[data-cmdk-idx="${this._idx}"]`);
      if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
    }
  },
  _move(delta) {
    if (this._items.length === 0) return;
    this._idx = Math.max(0, Math.min(this._items.length - 1, this._idx + delta));
    if (this._idx < 0) this._idx = this._items.length - 1;
    this._updateActive();
  }
};
window.cmdK = cmdK;

// CmdK input handler
document.getElementById('cmdkInput').addEventListener('input', function(e) {
  cmdK._idx = -1;
  cmdK._populate(this.value);
});
document.getElementById('cmdkInput').addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdK._move(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdK._move(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); cmdK._pick(cmdK._idx >= 0 ? cmdK._idx : 0); }
  else if (e.key === 'Escape') { e.preventDefault(); cmdK.close(); }
});
document.getElementById('cmdkOverlay').addEventListener('click', function(e) {
  if (e.target === this) cmdK.close();
});

// ============================================================
// KEYBOARD HANDLER
// ============================================================
let focusedTaskId = null;

function focusTaskRow(id) {
  const prev = document.querySelector('.task-row.key-focused');
  if (prev) prev.classList.remove('key-focused');
  const row = document.querySelector(`.task-row[data-id="${id}"]`);
  if (row) { row.classList.add('key-focused'); row.scrollIntoView({ block: 'nearest' }); }
  focusedTaskId = id;
}

function clearFocusRow() {
  const prev = document.querySelector('.task-row.key-focused');
  if (prev) prev.classList.remove('key-focused');
  focusedTaskId = null;
}

function getVisibleTaskIds() {
  const rows = document.querySelectorAll('#listContent .task-row, #dailyTasksContainer .task-row');
  return Array.from(rows).map(r => Number(r.dataset.id));
}

document.addEventListener('keydown', function(e) {
  // Ignore if focus is inside input, textarea, or select
  const tag = document.activeElement?.tagName?.toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') {
    if (e.key === 'Escape') document.activeElement.blur();
    return;
  }

  // Mod+K → Command Palette
  if (e[MOD_KEY] && e.key === 'k') {
    e.preventDefault();
    if (document.getElementById('focusOverlay').classList.contains('show')) return;
    if (document.getElementById('cmdkOverlay').classList.contains('show')) { cmdK.close(); return; }
    if (document.getElementById('quickAddOverlay').classList.contains('show')) { closeQuickAdd(); return; }
    cmdK.open();
    return;
  }

  // Mod+N → Quick Add
  if (e[MOD_KEY] && e.key === 'n') {
    e.preventDefault();
    openQuickAdd();
    return;
  }

  // Mod+/ → Show shortcuts
  if (e[MOD_KEY] && e.key === '/') {
    e.preventDefault();
    showToast(`${MOD_LABEL}+K 命令面板 · ${MOD_LABEL}+N 新建 · J/K 导航 · Space 完成 · Tab 缩进 · 1/2/3 优先级`);
    return;
  }

  // Escape
  if (e.key === 'Escape') {
    if (document.getElementById('aiPopup')?.classList.contains('open')) { closeAIPopup(); return; }
    if (document.getElementById('cmdkOverlay').classList.contains('show')) { cmdK.close(); return; }
    if (document.getElementById('quickAddOverlay').classList.contains('show')) { closeQuickAdd(); return; }
    if (document.getElementById('miscTypeModal').classList.contains('show')) { closeMiscTypeModal(); return; }
    if (document.getElementById('miscRecordModal').classList.contains('show')) { closeMiscRecordModal(); return; }
    if (document.getElementById('focusOverlay').classList.contains('show')) { exitFocus(); return; }
    if (detailTaskId) { closeDetail(); return; }
    clearFocusRow();
    hideCalendarPopover();
    return;
  }

  // G chord for view switching
  if (e.key === 'g' && !e[MOD_KEY]) {
    if (document.getElementById('quickAddOverlay').classList.contains('show')) return;
    if (document.getElementById('cmdkOverlay').classList.contains('show')) return;
    // Store that we're in G-chord state
    const onGChord = function(ev) {
      document.removeEventListener('keydown', onGChord);
      if (ev.key === 't') switchView('daily');
      else if (ev.key === 'o') switchView('list');
      else if (ev.key === 'c') switchView('calendar');
      else if (ev.key === 'g') switchView('gantt');
      else if (ev.key === 'm') switchView('misc');
      else if (ev.key === 'r') switchView('report');
      else if (ev.key === 'a') openAIPopup();
    };
    document.addEventListener('keydown', onGChord, { once: false });
    setTimeout(() => document.removeEventListener('keydown', onGChord), 800);
    return;
  }

  // Task list navigation
  const visibleIds = getVisibleTaskIds();
  if (visibleIds.length === 0) return;

  if (e.key === 'j' || e.key === 'ArrowDown') {
    e.preventDefault();
    const idx = focusedTaskId ? visibleIds.indexOf(focusedTaskId) : -1;
    const next = idx < visibleIds.length - 1 ? visibleIds[idx + 1] : visibleIds[0];
    focusTaskRow(next);
    return;
  }
  if (e.key === 'k' || e.key === 'ArrowUp') {
    e.preventDefault();
    const idx = focusedTaskId ? visibleIds.indexOf(focusedTaskId) : -1;
    const prev = idx > 0 ? visibleIds[idx - 1] : visibleIds[visibleIds.length - 1];
    focusTaskRow(prev);
    return;
  }

  // Space → toggle completed
  if (e.key === ' ' && focusedTaskId) {
    e.preventDefault();
    const t = getTask(focusedTaskId);
    if (t) {
      const newStatus = t.status === 'completed' ? 'not-started' : 'completed';
      updateTask(focusedTaskId, { status: newStatus });
      showToast(newStatus === 'completed' ? '已完成' : '标记为未完成', 1500);
    }
    return;
  }

  // Enter → open detail
  if (e.key === 'Enter' && focusedTaskId) {
    e.preventDefault();
    openDetail(focusedTaskId);
    return;
  }

  // 1/2/3 → set priority
  if (['1','2','3'].includes(e.key) && focusedTaskId) {
    e.preventDefault();
    const p = parseInt(e.key);
    const t = getTask(focusedTaskId);
    if (t && t.priority !== p) {
      updateTask(focusedTaskId, { priority: p });
      showToast(`优先级设为 P${p}`, 1500);
    }
    return;
  }

  // Tab/Shift+Tab → indent/outdent (move as subtask)
  if (e.key === 'Tab' && focusedTaskId) {
    e.preventDefault();
    const t = getTask(focusedTaskId);
    if (!t) return;
    const visible = getVisibleTaskIds();
    const myIdx = visible.indexOf(t.id);
    if (e.shiftKey) {
      // Outdent: remove parent
      if (t.parentId) {
        updateTask(t.id, { parentId: null });
        showToast('已提升层级', 1500);
      }
    } else {
      // Indent: parent = previous visible task
      if (myIdx > 0) {
        const prevId = visible[myIdx - 1];
        if (prevId !== t.parentId) {
          updateTask(t.id, { parentId: prevId });
          showToast('已变为子任务', 1500);
        }
      }
    }
    return;
  }
});

// ============================================================
// INIT
// ============================================================
async function cleanCompleted() {
  const toDelete = todos.filter(t => t.status === 'completed').map(t => t.id);
  if (toDelete.length === 0) { showToast('没有已完成的任务'); return; }
  if (!confirm(`删除 ${toDelete.length} 个已完成任务？此操作不可撤销。`)) return;
  for (const id of toDelete) {
    todos = todos.filter(t => t.id !== id && t.parentId !== id);
  }
  await saveTodos();
  renderAll();
  showToast(`已删除 ${toDelete.length} 个已完成任务`);
}

async function fixParentStatuses() {
  for (const t of todos) {
    if (hasChildren(t.id)) {
      const children = getChildren(t.id);
      if (children.some(c => c.status === 'in-progress') && t.status === 'not-started') {
        t.status = 'in-progress';
      }
    }
  }
  await saveTodos();
}

async function initApp() {
  document.getElementById('fabBtn').title = `快速添加 (${MOD_LABEL}+K)`;

  // Kick off misc load in parallel — don't block on it
  const miscLoadPromise = loadMiscData().then(() => {
    // Re-render whichever view the user is currently on, in case they
    // navigated to misc/report before the data finished loading
    if (currentView === 'misc' || currentView === 'report') {
      renderView(currentView);
    }
    updateNavBadges();
  }).catch(e => {
    console.warn('loadMiscData failed:', e);
  });

  try {
    await initData();
    await recalcAllParentStatuses();
    await fixParentStatuses();
    getRootTasks().forEach(t => expandedIds.add(t.id));
    updateSidebarDate();
    if (currentView === 'list') switchView('list');
    renderSidebarTags();
    updateNavBadges();
    updateSidebarProgress();
  } catch (e) {
    showToast('初始化异常: ' + (e.message || e));
  }

  // Wait so any error surfaces
  await miscLoadPromise;
}

initApp().catch(e => {
  console.error('initApp failed:', e);
  showToast('初始化失败: ' + (e.message || e));
});
</script>

  (function () {
    var root = document.documentElement;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function pref() { return localStorage.getItem('theme') || 'system'; }
    function apply(p) {
      var dark = p === 'dark' || (p === 'system' && mq.matches);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.querySelectorAll('.theme-opt').forEach(function (b) {
        b.classList.toggle('active', b.dataset.themeSet === p);

        var p = b.dataset.themeSet;
        localStorage.setItem('theme', p);
        apply(p);
      });
    });
    if (mq.addEventListener) {
      mq.addEventListener('change', function () { if (pref() === 'system') apply('system'); });
    }
    apply(pref());
  })();
